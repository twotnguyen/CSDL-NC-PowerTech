    const ra = duongVe.filter(d => d.a === chon && d.b !== chon), vao = duongVe.filter(d => d.b === chon && d.a !== chon);
    const lienKet = `<p class="tt" style="margin-bottom:0"><span class="kh ra-m"></span>Đi ra: ${ra.length}</p>${dsLk(ra, d => d.b)}<p class="tt" style="margin:0"><span class="kh vao-m"></span>Đi vào: ${vao.length}</p>${dsLk(vao, d => d.a)}`;
    if (b) {
      noi = `<h2 class="ma">${b.ten}</h2><p class="ghi" style="margin-bottom:6px">${e(b.moTa)} · ${LOAI[b.loai] || ''}</p>${lienKet}<div class="hang"><span class="dc ${b.truoc === 'BCNF' ? '' : 'xau'}">Trước: ${e(b.truoc)}</span><span class="dc">Sau: ${e(b.sau)}</span></div><p class="tt">Khóa: <span class="ma">${e(b.khoa)}</span></p>${bangCot(b, true)}<h3>Dữ liệu minh họa</h3>${ketQua(`SELECT * FROM ${b.ten} LIMIT 8`)}`; }
    else { const u = D.erd.nut.find(x => x.id === chon); noi = `<h2>${e(u ? u.nhan : chon)}</h2><p class="ghi">Mối kết hợp.</p>${lienKet}`; }
  } else if (ma === 'hinh') { const h = D.hinh[hinhChon]; noi = `<h2>${h.so}. ${e(h.ten)}</h2><p class="ghi">Hình vector, phóng to không vỡ nét. Dùng con lăn chuột để phóng to, kéo để di chuyển.</p>`; }
  else noi = `<h2>${ma === 'erd' ? 'Mô hình ERD' : ma === 'thi' ? 'Đồ thị quan hệ' : 'Sơ đồ quan hệ'}</h2><p class="ghi">Bấm một ${ma === 'quanhe' ? 'bảng' : 'nút'} để làm sáng các liên kết và xem chi tiết. Kéo ${ma === 'quanhe' ? 'bảng' : 'nút'} để xếp lại, cuộn chuột để phóng to, kéo nền để di chuyển.</p>${
    ma === 'erd' ? '<p class="tt">Chữ nhật vàng là thực thể, oval xanh là mối kết hợp có thuộc tính, oval cam là mối kết hợp còn lại.</p>' : ma === 'quanhe' ? '<p class="tt"><span class="pk">Đỏ</span> khóa chính, <span class="pfk">xanh lam</span> vừa khóa chính vừa khóa ngoại, <span class="fk">xanh lục</span> khóa ngoại, xám cột cho phép rỗng. Nét liền: khóa ngoại nằm trong khóa chính.</p>' : '<p class="tt">25 nút, 43 cung, 8 nút vào.</p>'}`;
  ben.innerHTML = (ma === 'hinh' ? '' : chonDuong) + `<div style="margin-top:12px">${noi}</div>`;
  const s = $('#dgChon'); if (s) s.onchange = () => chonDg(+s.value);
  ben.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { if (nut[x.dataset.c]) { chon = x.dataset.c; toMau(); moBen(); } });
  ben.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { const k = ma === 'thi' ? String(D.thi.nut.find(n => n.ten === x.dataset.t)?.so) : x.dataset.t; if (nut[k]) { chon = k; toMau(); moBen(); } });
}
function chonDg(so) {
  duongChon = D.duong.find(d => d.so === so) || null; chon = null; nhomChon = null; toMau(); moBen();
  if (duongChon) { const ten = duongChon.mach, ds = ma === 'thi' ? Object.values(nut).filter(n => ten.includes(n.ten)) : ten.map(t => nut[t]).filter(Boolean); if (ds.length) vua(ds); }
}
function veCanvas(g) {
  g.innerHTML = `<div class="thanh le"><div class="nhomnut" id="mode">${[['quanhe', 'Sơ đồ quan hệ'], ['erd', 'ERD'], ['thi', 'Đồ thị quan hệ'], ['hinh', 'Use Case, lưu đồ, phân rã']].map(([k, t]) => `<button class="nut" data-m="${k}" aria-pressed="${k === ma}">${t}</button>`).join('')}</div>
    <div class="nhomnut" id="chip" style="flex:1 1 240px;min-width:0"></div>
    <input type="search" id="tim" list="dsTim" aria-label="Tìm bảng" placeholder="Tìm bảng" style="width:150px"><datalist id="dsTim">${D.bang.map(b => `<option value="${b.ten}">`).join('')}</datalist></div>
  <div class="gian ${benAn ? 'an' : ''}" id="gian"><div class="ve"><svg id="cv" role="img" aria-label="Sơ đồ phóng to được"><g id="cam"></g></svg>
    <span class="tile" id="tile">100%</span><svg id="ban" aria-label="Bản đồ thu nhỏ" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="noi-nut"><button class="nut" id="vaiTro" aria-pressed="${hienVaiTro}">Đường tới NHANVIEN</button><button class="nut" id="nhanBat" aria-pressed="${hienNhan}">Nhãn</button><button class="nut" id="xepLai">Xếp lại</button><button class="nut" id="nho" aria-label="Thu nhỏ">−</button><button class="nut" id="to" aria-label="Phóng to">+</button><button class="nut" id="vua">Vừa màn hình</button><button class="nut" id="benNut">Khung bên</button></div></div><div class="keo-ben" id="keoBen" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi cỡ khung bên" tabindex="0" title="Kéo để đổi cỡ, bấm đúp để trả về cỡ mặc định"></div><aside class="ben" aria-label="Chi tiết"></aside></div>`;
  cv = $('#cv'); gCam = $('#cam'); ganCam();
  $('#mode').querySelectorAll('.nut').forEach(b => b.onclick = () => { ma = b.dataset.m; duongChon = null; $('#mode').querySelectorAll('.nut').forEach(x => x.setAttribute('aria-pressed', x === b)); dungCanh(); });
  $('#vua').onclick = () => vua();
  const giua = h => { const r = cv.getBoundingClientRect(); zoomTai(r.width / 2, r.height / 2, h); };
  $('#to').onclick = () => giua(1.3); $('#nho').onclick = () => giua(.77);
  $('#vaiTro').onclick = x => { hienVaiTro = vaiTroMa[ma] = !hienVaiTro; x.currentTarget.setAttribute('aria-pressed', hienVaiTro); veDuong(); };
  $('#nhanBat').onclick = x => { hienNhan = !hienNhan; x.currentTarget.setAttribute('aria-pressed', hienNhan); apCam(); };
  $('#xepLai').onclick = () => { try { localStorage.removeItem('viTri-' + ma); } catch {} dungCanh(); };
  $('#benNut').onclick = () => { benAn = !benAn; $('#gian').classList.toggle('an', benAn); requestAnimationFrame(apCam); };
  ganKeoBen();
  $('#tim').oninput = x => { const v = x.target.value.trim().toUpperCase(), k = ma === 'thi' ? String(D.thi.nut.find(n => n.ten === v)?.so) : v; if (nut[k]) { chon = k; duongChon = null; toMau(); moBen(); vua([nut[k]]); } };
  dungCanh();
  addEventListener('keydown', phim);
}
let rongBen = lu('rongBen') || 400;
function datBen(w, giu) {            // giu: cửa sổ đang hẹp thì chỉ co tạm, không đổi cỡ người dùng đã chọn
  const g = $('#gian'), toiDa = Math.min(1000, g.clientWidth - 280), ap = Math.round(Math.max(260, Math.min(toiDa, w)));
  if (!giu) rongBen = ap;
  g.style.setProperty('--ben', ap + 'px');
  $('#keoBen').setAttribute('aria-valuenow', ap);
  apCam();
}
function ganKeoBen() {
  const k = $('#keoBen'), g = $('#gian');
  datBen(rongBen, true);
  k.onpointerdown = x => { x.preventDefault(); try { k.setPointerCapture(x.pointerId); } catch {} k.classList.add('dang'); document.body.style.userSelect = 'none';
    const r = g.getBoundingClientRect();
    k.onpointermove = y => datBen(r.right - y.clientX);
    k.onpointerup = k.onpointercancel = () => { k.onpointermove = k.onpointerup = k.onpointercancel = null; k.classList.remove('dang'); document.body.style.userSelect = ''; lu('rongBen', rongBen); }; };
  k.ondblclick = () => { datBen(400); lu('rongBen', 400); };
  k.onkeydown = x => { const b = { ArrowLeft: 30, ArrowRight: -30 }[x.key]; if (b) { datBen(rongBen + b); lu('rongBen', rongBen); x.preventDefault(); x.stopPropagation(); } };
}
function phim(x) {
  if (hien !== 'canvas' || /INPUT|TEXTAREA|SELECT/.test(x.target.tagName)) return;
  const b = 60, m = { ArrowLeft: [b, 0], ArrowRight: [-b, 0], ArrowUp: [0, b], ArrowDown: [0, -b] }[x.key];
  if (m) { cam.x += m[0]; cam.y += m[1]; apCam(); x.preventDefault(); }
  if (x.key === '+' || x.key === '=') $('#to').click(); if (x.key === '-') $('#nho').click(); if (x.key === '0') vua();
}

/* ---------- các mục dạng trang ---------- */
const trang = {
  canvas: veCanvas,
  bang(g, ten) {
    const nhom = Object.keys(LOAI); let c = ten || 'MATHANG';
    const ve1 = () => { const b = TONG[c];
      g.innerHTML = `<div class="cuon-trang le"><div class="rong"><h2>26 quan hệ sau cải tiến</h2><p class="ghi">Chữ đỏ là khóa chính, xanh lam vừa khóa chính vừa khóa ngoại, xanh lục là khóa ngoại.</p>
      <div class="hai"><div class="khung ds">${nhom.map(l => `<h3>${LOAI[l]}</h3>` + D.bang.filter(x => x.loai === l).map(x => `<button class="muc" aria-current="${x.ten === c}" data-t="${x.ten}"><span class="ma">${x.ten}</span><small>${e(x.moTa)}</small></button>`).join('')).join('')}</div>
      <div class="khung chi"><div class="hang" style="justify-content:space-between"><h2 class="ma" style="margin:0">${b.ten}</h2><button class="nut" id="xemSo">Xem trên sơ đồ</button></div><p class="ghi">${e(b.moTa)} · ${LOAI[b.loai] || ''}</p>
      <div class="hang"><span class="dc ${b.truoc === 'BCNF' ? '' : 'xau'}">Trước: ${e(b.truoc)}</span><span>→</span><span class="dc">Sau: ${e(b.sau)}</span></div><p class="tt">Khóa: <span class="ma">${e(b.khoa)}</span></p>${bangCot(b)}
      ${b.tanTu ? `<h3>Tân từ</h3><p class="ghi">${e(b.tanTu)}</p>` : ''}${b.rangBuoc ? `<h3>Ràng buộc</h3><p class="ghi">${e(b.rangBuoc)}</p>` : ''}<h3>Dữ liệu minh họa</h3>${ketQua(`SELECT * FROM ${b.ten} LIMIT 20`)}</div></div></div></div>`;
      g.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { c = x.dataset.t; ve1(); });
      $('#xemSo', g).onclick = () => { ma = 'quanhe'; hien = 'canvas'; ve(); chon = c; toMau(); moBen(); vua([nut[c]]); }; };
    ve1();
  },
  cung(g) {
    g.innerHTML = `<div class="cuon-trang le"><div class="rong"><h2>43 cung của đồ thị quan hệ</h2><p class="ghi">Bản số xuôi và ngược cùng ngữ nghĩa của từng cung.</p><div class="loc"><input type="search" id="tim2" aria-label="Lọc cung" placeholder="Lọc theo tên quan hệ, ví dụ DONHANG"></div><div class="cuon"><table class="bang"><thead><tr><th>Cung</th><th>Đi</th><th>Đến</th><th>Xuôi</th><th>Ngược</th><th>Ý nghĩa xuôi</th><th>Ý nghĩa ngược</th></tr></thead><tbody id="dsCung"></tbody></table></div></div></div>`;
    const loc = () => { const q = $('#tim2', g).value.trim().toUpperCase(); $('#dsCung', g).innerHTML = D.cung.filter(c => !q || (c.di + c.den).includes(q)).map(c => `<tr><td class="ma">${e(c.cung)}</td><td class="ma">${e(c.di)}</td><td class="ma">${e(c.den)}</td><td class="ma">${e(c.xuoi)}</td><td class="ma">${e(c.nguoc)}</td><td>${e(c.yXuoi)}</td><td>${e(c.yNguoc)}</td></tr>`).join(''); };
    $('#tim2', g).oninput = loc; loc();
  },
  duong(g) {
    const vao = [...new Set(D.duong.map(d => d.mach[0]))]; let c = 10, loc = 'Tất cả', tim = '';
    const ve1 = () => { const ds = D.duong.filter(d => (loc === 'Tất cả' || d.mach[0] === loc) && (!tim || (d.mach.join(' ') + d.yNghia).toUpperCase().includes(tim))), d = D.duong.find(x => x.so === c);
      g.innerHTML = `<div class="cuon-trang le"><div class="rong"><h2>61 con đường truy xuất</h2><p class="ghi">Kết quả do SQLite chạy ngay trong trình duyệt trên dữ liệu minh họa.</p>
      <div class="loc">${['Tất cả', ...vao].map(n => `<button class="chip" aria-pressed="${n === loc}" data-v="${n}">${n}</button>`).join('')}<input type="search" id="tim3" aria-label="Lọc đường" placeholder="Lọc, ví dụ KHACHHANG" value="${e(tim)}"></div>
      <div class="hai"><div class="khung ds">${ds.length ? ds.map(x => `<button class="muc" aria-current="${x.so === c}" data-s="${x.so}">Đường ${x.so}<small class="ma">${x.mach.join(' → ')}</small></button>`).join('') : '<p class="tt" style="padding:8px">Không có đường nào khớp.</p>'}</div>
      <div class="khung chi"><div class="hang" style="justify-content:space-between"><h2 style="margin:0">Đường ${d.so}</h2><span class="hang"><button class="nut" data-xem="thi">Xem trên đồ thị</button><button class="nut" data-xem="quanhe">Xem trên sơ đồ quan hệ</button></span></div><div class="mach">${d.mach.map(n => `<span class="n">${n}</span>`).join('<span class="m">→</span>')}</div><p>${e(d.yNghia)}</p><pre>${e(d.sql)}</pre>${ketQua(d.sql)}<p class="tt">Báo cáo ghi ${d.dong} dòng.</p></div></div></div></div>`;
      g.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { loc = b.dataset.v; ve1(); });
      g.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { c = +b.dataset.s; ve1(); });
      g.querySelectorAll('[data-xem]').forEach(b => b.onclick = () => { ma = b.dataset.xem; hien = 'canvas'; ve(); requestAnimationFrame(() => requestAnimationFrame(() => chonDg(c))); });
      const o = $('#tim3', g); o.oninput = () => { tim = o.value.trim().toUpperCase(); ve1(); const m = $('#tim3', g); m.focus(); m.setSelectionRange(m.value.length, m.value.length); }; };
    ve1();
  },
  'khai-thac'(g) {
    let c = 'K4';
    const ve1 = () => { const k = D.khaiThac.find(x => x.ma === c);
      g.innerHTML = `<div class="cuon-trang le"><div class="rong"><h2>9 truy vấn khai thác</h2><p class="ghi">Có thể sửa câu lệnh rồi chạy lại.</p><div class="hai"><div class="khung ds">${D.khaiThac.map(x => `<button class="muc" aria-current="${x.ma === c}" data-k="${x.ma}"><b>${x.ma}</b><small>${e(x.ten)}</small></button>`).join('')}</div>
      <div class="khung chi"><h2>${k.ma}. ${e(k.ten)}</h2><p class="tt">Đường: ${e(k.duong)}</p><textarea id="ks" aria-label="Câu lệnh ${k.ma}" spellcheck="false">${e(k.sql)}</textarea><div class="hang"><button class="nut chinh" id="chay">Chạy</button><button class="nut" id="datLai">Trả lại câu gốc</button></div><div id="kq">${ketQua(k.sql)}</div><p class="tt">Báo cáo ghi ${k.dong} dòng.</p></div></div></div></div>`;
      g.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { c = b.dataset.k; ve1(); }); $('#chay', g).onclick = () => { $('#kq', g).innerHTML = ketQua($('#ks', g).value); }; $('#datLai', g).onclick = ve1; };
    ve1();
  },
  sql(g) {
    g.innerHTML = `<div class="cuon-trang le"><div class="rong"><h2>Chạy SQL tự do</h2><p class="ghi">Cơ sở dữ liệu nằm trong trình duyệt này. Câu lệnh sửa dữ liệu chỉ có tác dụng tới khi tải lại trang hoặc khôi phục.</p><textarea id="tu" aria-label="Câu lệnh SQL" spellcheck="false">SELECT dh.SoDH, dh.TinhTrangDH, COUNT(*) AS SoDong, SUM(ct.SoLuongBan * ct.DonGiaChot) AS TienHang
FROM DONHANG dh
JOIN CHITIETDONHANG ct ON ct.MaDH = dh.MaDH
GROUP BY dh.MaDH
ORDER BY dh.MaDH;</textarea><div class="hang"><button class="nut chinh" id="chay">Chạy</button><button class="nut" id="khoiPhuc">Khôi phục dữ liệu</button><span class="tt">Ctrl + Enter để chạy</span></div><div id="kq"></div></div></div>`;
    const chay = () => { $('#kq', g).innerHTML = ketQua($('#tu', g).value); }; $('#chay', g).onclick = chay; $('#tu', g).onkeydown = x => { if (x.ctrlKey && x.key === 'Enter') chay(); };
    $('#khoiPhuc', g).onclick = () => { if (db) { db.close(); moDb(); } $('#kq', g).innerHTML = '<p class="tt">Đã khôi phục dữ liệu minh họa.</p>'; }; chay();
  },
};
let hien = 'canvas';
function ve() {
  removeEventListener('keydown', phim);
  $('#tab').innerHTML = TABS.map(([k, t]) => `<button role="tab" aria-selected="${k === hien}" data-k="${k}">${t}</button>`).join('');
  $('#tab').querySelectorAll('button').forEach(b => b.onclick = () => { hien = b.dataset.k; ve(); });
  trang[hien]($('#noi'));
}
addEventListener('resize', () => { if (hien === 'canvas' && $('#keoBen')) datBen(rongBen, true); });
const dau = location.hash.slice(1); if (TABS.some(t => t[0] === dau)) hien = dau;
ve();
khoiDong();
</script>
