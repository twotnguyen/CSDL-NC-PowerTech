<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Sổ tay PowerTech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Bàn can sơ đồ: nền xanh giấy can có lưới, bảng trắng, màu khóa PK/PFK/FK lấy đúng quy ước trong báo cáo */
:root {
  --nen: #eef3f8; --mat: #ffffff; --mat2: #e3ecf5; --chu: #16263a; --mo: #54677c; --vien: #c6d4e2; --luoi: #dbe5ef;
  --nhan: #1c5d99; --nhan-chu: #ffffff; --pk: #b3261e; --pfk: #1f4eb4; --fk: #2e7d32; --dat: #fbecd2; --dat-chu: #7a4a00;
  --dau: #bdd7ee; --dau-chu: #10243a; --net: #3a5f8f; --sang: #d9480f; --cam: #fde3c8; --cam-v: #d98a1f; --lam: #dbe8fa; --lam-v: #5b7fa6;
  --vang: #fff1c9; --vang-v: #d9b44a; --vung: rgba(28, 93, 153, .055); --ra: #d9480f; --vao: #a61e9a;
  --than: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; --ma: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --nen: #101a26; --mat: #182534; --mat2: #213244; --chu: #e6edf5; --mo: #9db0c4; --vien: #33475c; --luoi: #1b2a3a;
  --nhan: #7db8ee; --nhan-chu: #0c1825; --pk: #ff9c94; --pfk: #a3bdff; --fk: #8fd694; --dat: #3d2f17; --dat-chu: #f5cf8f;
  --dau: #2b4a6b; --dau-chu: #e6edf5; --net: #8fb2d8; --sang: #ffa45c; --cam: #4a3216; --cam-v: #e0a24a; --lam: #24405f; --lam-v: #8fb2d8;
  --vang: #41381c; --vang-v: #c9a84a; --vung: rgba(125, 184, 238, .07); --ra: #ffa45c; --vao: #f08be6; color-scheme: dark } }
:root[data-theme="dark"] {
  --nen: #101a26; --mat: #182534; --mat2: #213244; --chu: #e6edf5; --mo: #9db0c4; --vien: #33475c; --luoi: #1b2a3a;
  --nhan: #7db8ee; --nhan-chu: #0c1825; --pk: #ff9c94; --pfk: #a3bdff; --fk: #8fd694; --dat: #3d2f17; --dat-chu: #f5cf8f;
  --dau: #2b4a6b; --dau-chu: #e6edf5; --net: #8fb2d8; --sang: #ffa45c; --cam: #4a3216; --cam-v: #e0a24a; --lam: #24405f; --lam-v: #8fb2d8;
  --vang: #41381c; --vang-v: #c9a84a; --vung: rgba(125, 184, 238, .07); --ra: #ffa45c; --vao: #f08be6; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--nen); color: var(--chu); font: 15px/1.55 var(--than); margin: 0; display: flex; flex-direction: column }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--mat) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--nhan); outline-offset: 2px }
code, pre, .ma { font-family: var(--ma) }
.le { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { background: var(--mat); border-bottom: 1px solid var(--vien); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap }
h1 { font-size: 1.02rem; margin: 0; padding-block: 8px; white-space: nowrap }
.tab { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1 1 320px }
.tab button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 11px 7px; white-space: nowrap; color: var(--mo); font-weight: 500 }
.tab button[aria-selected="true"] { color: var(--nhan); border-color: var(--nhan); font-weight: 600 }
main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column }
.cuon-trang { padding-block: 18px 40px; overflow: auto; flex: 1 1 auto; min-height: 0 }
.rong { max-width: 1320px; margin-inline: auto }
h2 { font-size: 1.12rem; margin: 0 0 4px }
h3 { font-size: .94rem; margin: 16px 0 6px }
.ghi { color: var(--mo); margin: 0 0 12px; max-width: 72ch; font-size: .9rem }
.khung { background: var(--mat); border: 1px solid var(--vien); border-radius: 6px; min-width: 0 }
.hai { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 14px; align-items: start }
.ds { max-height: 72vh; overflow: auto; padding: 6px }
.ds h3 { margin: 10px 8px 4px; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--mo) }
.muc { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 8px; overflow-wrap: anywhere }
.muc:hover { background: var(--mat2) }
.muc[aria-current="true"] { background: var(--nhan); color: var(--nhan-chu) }
.muc small { display: block; opacity: .78; font-size: .78rem; line-height: 1.35 }
.chi { padding: 16px; min-width: 0 }
.nut { background: var(--mat2); border: 1px solid var(--vien); border-radius: 4px; padding: 4px 10px; font-size: .86rem }
.nut.chinh { background: var(--nhan); color: var(--nhan-chu); border-color: var(--nhan); font-weight: 600 }
.nut[aria-pressed="true"] { background: var(--nhan); color: var(--nhan-chu); border-color: var(--nhan) }
.loc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px }
input[type=search], select { padding: 4px 8px; background: var(--mat); border: 1px solid var(--vien); border-radius: 4px; font-size: .86rem; min-width: 0 }
.chip { background: var(--mat); border: 1px solid var(--vien); border-radius: 999px; padding: 1px 10px; font-size: .82rem; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--nhan); color: var(--nhan-chu); border-color: var(--nhan) }
.cuon { overflow-x: auto; border: 1px solid var(--vien); border-radius: 4px }
table.bang { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums }
.bang th { background: var(--mat2); text-align: left; font-weight: 600; white-space: nowrap }
.bang th, .bang td { padding: 4px 8px; border-bottom: 1px solid var(--vien); vertical-align: top }
.bang tbody tr:last-child td { border-bottom: 0 }
.bang td.ma { white-space: nowrap }
.pk { color: var(--pk); font-weight: 600 } .pfk { color: var(--pfk); font-weight: 600 } .fk { color: var(--fk) }
.rong-cot { color: var(--mo) }
.lk { background: none; border: 0; padding: 0; color: var(--fk); text-decoration: underline dashed; font-family: var(--ma); font-size: .78rem; overflow-wrap: anywhere; text-align: left }
.mach { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 6px 0 10px }
.mach .n { font-family: var(--ma); font-size: .8rem; background: var(--mat2); border: 1px solid var(--vien); border-radius: 3px; padding: 1px 6px; overflow-wrap: anywhere }
.mach .m { color: var(--mo) }
pre { background: var(--mat2); border: 1px solid var(--vien); border-radius: 4px; padding: 9px 11px; font-size: .79rem; line-height: 1.5; overflow-x: auto; margin: 8px 0 }
textarea { width: 100%; min-height: 150px; font: .85rem/1.5 var(--ma); padding: 10px 12px; color: var(--chu); background: var(--mat2); border: 1px solid var(--vien); border-radius: 4px; resize: vertical }
.dc { display: inline-block; font-size: .78rem; font-weight: 600; padding: 0 7px; border-radius: 3px; background: var(--mat2) }
.dc.xau { background: var(--dat); color: var(--dat-chu) }
.tt { font-size: .84rem; color: var(--mo); margin: 8px 0 }
.loi { background: var(--dat); color: var(--dat-chu); padding: 8px 10px; border-radius: 4px; font-size: .88rem; overflow-wrap: anywhere }
.hang { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

/* canvas */
.thanh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding-block: 7px; background: var(--mat); border-bottom: 1px solid var(--vien) }
.nhomnut { display: flex; flex-wrap: wrap; gap: 3px }
.gian { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--ben, 400px); position: relative }
.gian.an { grid-template-columns: minmax(0, 1fr) 0 }
.gian.an .ben, .gian.an .keo-ben { display: none }
.keo-ben { position: absolute; top: 0; bottom: 0; right: calc(var(--ben, 400px) - 5px); width: 10px; z-index: 3; cursor: col-resize; touch-action: none; background: none; border: 0; padding: 0 }
.keo-ben::after { content: ""; position: absolute; top: 50%; left: 3px; width: 4px; height: 44px; margin-top: -22px; border-radius: 2px; background: var(--vien) }
.keo-ben:hover::after, .keo-ben.dang::after, .keo-ben:focus-visible::after { background: var(--nhan); height: 72px; margin-top: -36px }
.ve { position: relative; min-width: 0; min-height: 0; overflow: hidden; background-color: var(--nen);
  background-image: linear-gradient(var(--luoi) 1px, transparent 1px), linear-gradient(90deg, var(--luoi) 1px, transparent 1px); background-size: 26px 26px }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none }
#cv.keo { cursor: grabbing }
.ben { background: var(--mat); border-left: 1px solid var(--vien); overflow: auto; padding: 12px 14px; min-width: 0 }
.noi-nut { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 20px) }
.noi-nut .nut { background: var(--mat); box-shadow: 0 1px 3px rgba(10, 25, 45, .22) }
.noi-nut .nut[aria-pressed="true"] { background: var(--nhan); color: var(--nhan-chu) }
.cot-y { display: block; font: .76rem/1.3 var(--than); color: var(--mo); white-space: normal }
#ban { position: absolute; left: 10px; bottom: 10px; width: 172px; height: 118px; background: var(--mat); border: 1px solid var(--vien); border-radius: 4px; box-shadow: 0 1px 3px rgba(10, 25, 45, .22); touch-action: none; cursor: pointer }
.tile { position: absolute; left: 10px; top: 8px; font-size: .76rem; color: var(--mo); background: var(--mat); border: 1px solid var(--vien); border-radius: 3px; padding: 0 6px; font-variant-numeric: tabular-nums }
/* các phần của sơ đồ */
.t-vo { fill: var(--mat); stroke: var(--lam-v); stroke-width: 1.2 }
.t-dau { fill: var(--dau) }
.t-ten { fill: var(--dau-chu); font: 600 14px var(--than); text-anchor: middle }
.t-cot { font: 500 12.5px var(--ma); fill: var(--chu) }
.t-kieu { font: 12px var(--ma); fill: var(--mo) }
.t-tag { font: 600 11px var(--ma); fill: var(--mo); text-anchor: end }
.c-pk { fill: var(--pk) } .c-pfk { fill: var(--pfk) } .c-fk { fill: var(--fk) } .c-null { fill: var(--mo) }
.n-hover .t-vo { stroke: var(--nhan) }
.du { fill: none; stroke: var(--net); stroke-width: 1.5 }
.du.dut { stroke-dasharray: 7 5 }
.mui { fill: none; stroke: var(--net); stroke-width: 1.5 }
.nhan-du { font: 500 12px var(--than); fill: var(--chu); text-anchor: middle; paint-order: stroke; stroke: var(--nen); stroke-width: 4px; stroke-linejoin: round }
.ban-so { font: 600 12px var(--ma); fill: var(--chu); text-anchor: middle; paint-order: stroke; stroke: var(--nen); stroke-width: 4px; stroke-linejoin: round }
.vung-nhom { fill: var(--vung); stroke: var(--vien); stroke-width: 1; stroke-dasharray: 3 4 }
.vung-ten { font: 600 15px var(--than); fill: var(--mo) }
.e-vo { fill: var(--vang); stroke: var(--vang-v); stroke-width: 1.6 }
.e-ten { font: 600 14px var(--than); fill: var(--chu); text-anchor: middle }
.m-vo { fill: var(--lam); stroke: var(--lam-v); stroke-width: 1.6 }
.o-vo { fill: var(--cam); stroke: var(--cam-v); stroke-width: 1.4 }
.o-ten { font: 500 12.5px var(--than); fill: var(--chu); text-anchor: middle }
.g-tron { fill: var(--lam); stroke: var(--lam-v); stroke-width: 1.6 }
.g-tron.vao { stroke: var(--sang); stroke-width: 3 }
.g-so { font: 600 14px var(--ma); fill: var(--chu); text-anchor: middle }
.g-ten { font: 500 12px var(--than); fill: var(--chu); text-anchor: middle; paint-order: stroke; stroke: var(--nen); stroke-width: 4px; stroke-linejoin: round }
.mo { opacity: .13 }
.sang .du, .du.sang, .sang .mui, .mui.sang { stroke: var(--sang); stroke-width: 2.6 }
.nut-sang .t-vo, .nut-sang .e-vo, .nut-sang .m-vo, .nut-sang .g-tron { stroke: var(--sang); stroke-width: 2.6 }
.ra .du, .ra .mui { stroke: var(--ra); stroke-width: 2.8 }
.vao .du, .vao .mui { stroke: var(--vao); stroke-width: 2.8 }
.nut-ra .t-vo, .nut-ra .e-vo, .nut-ra .m-vo, .nut-ra .o-vo, .nut-ra .g-tron { stroke: var(--ra); stroke-width: 2.4 }
.nut-vao .t-vo, .nut-vao .e-vo, .nut-vao .m-vo, .nut-vao .o-vo, .nut-vao .g-tron { stroke: var(--vao); stroke-width: 2.4 }
.nut-chon .t-vo, .nut-chon .e-vo, .nut-chon .m-vo, .nut-chon .o-vo, .nut-chon .g-tron { stroke: var(--chu); stroke-width: 3.2 }
.vt:not(.ra, .vao, .sang, .mo) { opacity: .4 }
.kh { display: inline-block; width: 22px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.kh.ra-m { background: var(--ra) } .kh.vao-m { background: var(--vao) }
.lien { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px }
.lien button { background: var(--mat2); border: 1px solid var(--vien); border-radius: 3px; padding: 0 6px; font: .76rem var(--ma); overflow-wrap: anywhere; text-align: left }
.giay { fill: #fff }
[data-nut] { cursor: pointer }
@media (max-width: 820px) {
  .gian, .gian.an { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(340px, 1fr) auto }
  .ben { border-left: 0; border-top: 1px solid var(--vien); max-height: 44vh }
  #ban, .keo-ben { display: none }
  .hai { grid-template-columns: minmax(0, 1fr) } .ds { max-height: 260px }
}
</style>

<script>
const D = {"bang": [{"ten": "LOAIHANG", "loai": "co_ban", "moTa": "Loại hàng", "tanTu": "Mỗi loại hàng được phân biệt bằng mã loại hàng (MaLoai), có tên (TenLoai) và mô tả (MoTaLoai). Các loại hàng phân cấp: một loại có tối đa một loại cha (MaLoaiCha), ví dụ nhóm \"Linh kiện máy tính\" gồm \"Bộ nhớ RAM\". Tên không dùng để phân biệt vì hai loại hàng có thể trùng tên.", "rangBuoc": "MaLoai là số tự nhiên tăng dần. TenLoai không rỗng, tối đa 100 ký tự. MaLoaiCha rỗng với loại hàng ở cấp cao nhất và khác MaLoai của chính nó.", "khoa": "{MaLoai}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaLoai", "kieu": "INT", "rong": false, "y": "Mã loại hàng", "pk": true, "fk": null}, {"ten": "TenLoai", "kieu": "NVARCHAR(100)", "rong": false, "y": "Tên loại hàng", "pk": false, "fk": null}, {"ten": "MoTaLoai", "kieu": "NVARCHAR(500)", "rong": true, "y": "Mô tả loại hàng", "pk": false, "fk": null}, {"ten": "MaLoaiCha", "kieu": "INT", "rong": true, "y": "Mã loại hàng cha", "pk": false, "fk": "LOAIHANG"}]}, {"ten": "THUONGHIEU", "loai": "co_ban", "moTa": "Thương hiệu", "tanTu": "Mỗi thương hiệu được phân biệt bằng mã thương hiệu (MaTH), có tên (TenTH) không trùng với thương hiệu khác và mô tả (MoTaTH).", "rangBuoc": "MaTH là số tự nhiên tăng dần. TenTH không rỗng, không trùng, tối đa 100 ký tự.", "khoa": "{MaTH}; {TenTH}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaTH", "kieu": "INT", "rong": false, "y": "Mã thương hiệu", "pk": true, "fk": null}, {"ten": "TenTH", "kieu": "NVARCHAR(100)", "rong": false, "y": "Tên thương hiệu", "pk": false, "fk": null}, {"ten": "MoTaTH", "kieu": "NVARCHAR(500)", "rong": true, "y": "Mô tả thương hiệu", "pk": false, "fk": null}]}, {"ten": "MATHANG", "loai": "co_ban", "moTa": "Mặt hàng", "tanTu": "Mỗi mặt hàng có mã nội bộ (MaSP) và mã hàng thương mại (SKU) đều không trùng với mặt hàng nào khác. Thông tin gồm tên, mô tả, giá niêm yết, giá khuyến mãi (nếu có), thời hạn bảo hành theo tháng, tình trạng kinh doanh và cờ CoSeri cho biết mặt hàng có ghi số seri từng chiếc hay không. Mỗi mặt hàng thuộc đúng một loại (MaLoai) và một thương hiệu (MaTH).", "rangBuoc": "MaSP là số tự nhiên tăng dần. SKU không rỗng, không trùng. GiaNiemYet lớn hơn 0; GiaKhuyenMai nếu có phải nhỏ hơn hoặc bằng GiaNiemYet. ThoiHanBH từ 0 đến 120. TinhTrangKD chỉ nhận \"Đang kinh doanh\" hoặc \"Ngừng kinh doanh\".", "khoa": "{MaSP}; {SKU}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaSP", "kieu": "INT", "rong": false, "y": "Mã mặt hàng (nội bộ)", "pk": true, "fk": null}, {"ten": "SKU", "kieu": "VARCHAR(50)", "rong": false, "y": "Mã hàng thương mại", "pk": false, "fk": null}, {"ten": "TenSP", "kieu": "NVARCHAR(200)", "rong": false, "y": "Tên mặt hàng", "pk": false, "fk": null}, {"ten": "MoTaSP", "kieu": "NVARCHAR(2000)", "rong": true, "y": "Mô tả", "pk": false, "fk": null}, {"ten": "GiaNiemYet", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Giá niêm yết (đồng)", "pk": false, "fk": null}, {"ten": "GiaKhuyenMai", "kieu": "DECIMAL(15,0)", "rong": true, "y": "Giá khuyến mãi đang áp dụng", "pk": false, "fk": null}, {"ten": "ThoiHanBH", "kieu": "INT", "rong": false, "y": "Thời hạn bảo hành (tháng, 0 nếu không bảo hành)", "pk": false, "fk": null}, {"ten": "TinhTrangKD", "kieu": "NVARCHAR(20)", "rong": false, "y": "Đang kinh doanh hoặc đã ngừng", "pk": false, "fk": null}, {"ten": "CoSeri", "kieu": "BIT", "rong": false, "y": "Có theo dõi số seri từng chiếc", "pk": false, "fk": null}, {"ten": "MaLoai", "kieu": "INT", "rong": false, "y": "Loại hàng", "pk": false, "fk": "LOAIHANG"}, {"ten": "MaTH", "kieu": "INT", "rong": false, "y": "Thương hiệu", "pk": false, "fk": "THUONGHIEU"}]}, {"ten": "ANHMATHANG", "loai": "co_ban", "moTa": "Ảnh mặt hàng", "tanTu": "Mỗi mặt hàng có nhiều ảnh minh họa. Mỗi ảnh có mã (MaAnh), thuộc một mặt hàng (MaSP), có vị trí (ViTriAnh) trong mặt hàng đó, đường dẫn tệp (DuongDanAnh) và cờ ảnh đại diện (LaAnhChinh). Vị trí ảnh trong cùng một mặt hàng không trùng nhau.", "rangBuoc": "MaAnh là số tự nhiên tăng dần. ViTri ỗi mặt hàng có tối đa một giá trị cho một thông số.", "rangBuoc": "GiaTriTS không rỗng. Thông số (MaTS) phải thuộc loại hàng của mặt hàng (MaSP); đây là ràng buộc liên quan hệ không biểu diễn được bằng PTH.", "khoa": "{MaSP, MaTS}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaSP", "kieu": "INT", "rong": false, "y": "Mặt hàng", "pk": true, "fk": "MATHANG"}, {"ten": "MaTS", "kieu": "INT", "rong": false, "y": "Thông số", "pk": true, "fk": "DINHNGHIATHONGSO"}, {"ten": "GiaTriTS", "kieu": "NVARCHAR(200)", "rong": false, "y": "Giá trị của thông số", "pk": false, "fk": null}]}, {"ten": "KHACHHANG", "loai": "ngoai", "moTa": "Khách hàng", "tanTu": "Mỗi khách hàng được phân biệt bằng mã khách hàng (MaKH), có họ tên (HoTenKH), số điện thoại (SDTKH), email (EmailKH) nếu có và mã số thuế (MaSoThueKH) nếu là doanh nghiệp cần hóa đơn. Họ tên, số điện thoại hay email có thể trùng hoặc thay đổi nên không dùng để phân biệt hai khách.", "rangBuoc": "MaKH là số tự nhiên tăng dần. HoTenKH không rỗng, tối đa 100 ký tự. SDTKH gồm 10 chữ số. EmailKH nếu có phải có ký tự \"@\". Khách mua tại quầy không để lại thông tin thì không có hồ sơ khách hàng.", "khoa": "{MaKH}", "truoc": "chưa đạt 1NF", "sau": "BCNF", "cot": [{"ten": "MaKH", "kieu": "INT", "rong": false, "y": "Mã khách hàng", "pk": true, "fk": null}, {"ten": "HoLotKH", "kieu": "NVARCHAR(80)", "rong": false, "y": "Họ và tên lót khách hàng", "pk": false, "fk": null}, {"ten": "TenKH", "kieu": "NVARCHAR(30)", "rong": false, "y": "Tên khách hàng", "pk": false, "fk": null}, {"ten": "SDTKH", "kieu": "VARCHAR(15)", "rong": false, "y": "Số điện thoại", "pk": false, "fk": null}, {"ten": "EmailKH", "kieu": "VARCHAR(100)", "rong": true, "y": "Địa chỉ email", "pk": false, "fk": null}, {"ten": "MaSoThueKH", "kieu": "VARCHAR(14)", "rong": true, "y": "Mã số thuế (khách là doanh nghiệp)", "pk": false, "fk": null}]}, {"ten": "NHANVIEN", "loai": "ngoai", "moTa": "Nhân viên", "tanTu": "Mỗi nhân viên được phân biệt bằng mã nhân viên (MaNV), có họ tên (HoTenNV), số điện thoại (SDTNV), email (EmailNV) nếu có, ngày vào làm (NgayVaoLam), ngày nghỉ việc (NgayNghiViec) nếu đã nghỉ và tình trạng làm việc (TinhTrangNV). Nhân viên nghỉ việc vẫn giữ hồ sơ để tra cứu các chứng từ người đó đã lập hoặc duyệt. Mỗi nhân viên có một chức vụ chính (ChucVu) cho biết khâu nào người đó được làm: Quản lý, Bán hàng, Thu ngân, Kỹ thuật, Kho hoặc Giao hàng (giả thiết G6).", "rangBuoc": "MaNV là số tự nhiên tăng dần. HoTenNV không rỗng. TinhTrangNV chỉ nhận \"Đang làm\" hoặc \"Đã nghỉ\". ChucVu chỉ nhận \"Quản lý\", \"Bán hàng\", \"Thu ngân\", \"Kỹ thuật\", \"Kho\" hoặc \"Giao hàng\". NgayNghiViec không trước NgayVaoLam và chỉ có giá trị khi TinhTrangNV là \"Đã nghỉ\". Không xóa hồ sơ nhân viên đã có chứng từ.", "khoa": "{MaNV}", "truoc": "chưa đạt 1NF", "sau": "BCNF", "cot": [{"ten": "MaNV", "kieu": "INT", "rong": false, "y": "Mã nhân viên", "pk": true, "fk": null}, {"ten": "HoLotNV", "kieu": "NVARCHAR(80)", "rong": false, "y": "Họ và tên lót nhân viên", "pk": false, "fk": null}, {"ten": "TenNV", "kieu": "NVARCHAR(30)", "rong": false, "y": "Tên nhân viên", "pk": false, "fk": null}, {"ten": "SDTNV", "kieu": "VARCHAR(15)", "rong": false, "y": "Số điện thoại", "pk": false, "fk": null}, {"ten": "EmailNV", "kieu": "VARCHAR(100)", "rong": true, "y": "Địa chỉ email", "pk": false, "fk": null}, {"ten": "NgayVaoLam", "kieu": "DATE", "rong": false, "y": "Ngày vào làm", "pk": false, "fk": null}, {"ten": "NgayNghiViec", "kieu": "DATE", "rong": true, "y": "Ngày nghỉ việc (rỗng nếu còn làm)", "pk": false, "fk": null}, {"ten": "TinhTrangNV", "kieu": "NVARCHAR(20)", "rong": false, "y": "Đang làm hoặc đã nghỉ", "pk": false, "fk": null}, {"ten": "ChucVu", "kieu": "NVARCHAR(20)", "rong": false, "y": "Chức vụ chính của nhân viên", "pk": false, "fk": null}]}, {"ten": "TAIKHOAN", "loai": "nghiep_vu", "moTa": "Tài khoản đăng nhập", "tanTu": "Khách đặt hàng trên trang web và nhân viên thao tác trên hệ thống đều có tài khoản. Mỗi tài khoản có mã (MaTK) và tên đăng nhập (TenDangNhap) không trùng, lưu mật khẩu đã băm, tình trạng (khóa khi vi phạm hoặc nghi lộ mật khẩu) và thời điểm tạo. Tài khoản thuộc đúng một khách hàng (MaKH) hoặc đúng một nhân viên (MaNV); mỗi khách và mỗi nhân viên có tối đa một tài khoản. Quyền hạn của tài khoản nhân viên theo chức vụ (ChucVu) của nhân viên đó.", "rangBuoc": "MaTK là số tự nhiên tăng dần. TenDangNhap không rỗng, không trùng. TinhTrangTK chỉ nhận \"Hoạt động\" hoặc \"Bị khóa\". Đúng một trong hai cột MaKH, MaNV có giá trị. Các PTH có vế trái MaKH hoặc MaNV chỉ xét trên những tài khoản có giá trị đó (giả thiết G4).", "khoa": "{MaTK}; {TenDangNhap} (có điều kiện: {MaKH}; {MaNV})", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaTK", "kieu": "INT", "rong": false, "y": "Mã tài khoản", "pk": true, "fk": null}, {"ten": "TenDangNhap", "kieu": "VARCHAR(50)", "rong": false, "y": "Tên đăng nhập", "pk": false, "fk": null}, {"ten": "MatKhauBam", "kieu": "VARCHAR(255)", "rong": false, "y": "Mật khẩu đã băm (không lưu mật khẩu gốc)", "pk": false, "fk": null}, {"ten": "TinhTrangTK", "kieu": "NVARCHAR(20)", "rong": false, "y": "Hoạt động hoặc bị khóa", "pk": false, "fk": null}, {"ten": "ThoiDiemTaoTK", "kieu": "DATETIME", "rong": false, "y": "Thời điểm tạo tài khoản", "pk": false, "fk": null}, {"ten": "MaKH", "kieu": "INT", "rong": true, "y": "Khách hàng sở hữu tài khoản (rỗng nếu là tài khoản nhân viên)", "pk": false, "fk": "KHACHHANG"}, {"ten": "MaNV", "kieu": "INT", "rong": true, "y": "Nhân viên sở hữu tài khoản (rỗng nếu là tài khoản khách)", "pk": false, "fk": "NHANVIEN"}]}, {"ten": "NHACUNGCAP", "loai": "ngoai", "moTa": "Nhà cung cấp", "tanTu": "Mỗi nhà cung cấp (nhà phân phối, đại lý chính hãng) được phân biệt bằng mã nhà cung cấp (MaNCC), có tên công ty không trùng với nhà cung cấp khác, người liên hệ, số điện thoại, địa chỉ, mã số thuế và tình trạng hợp tác. Thông tin liên hệ có thể trùng hoặc thay đổi nên không dùng để phân biệt.", "rangBuoc": "MaNCC là số tự nhiên tăng dần. TenNCC không rỗng, không trùng. TinhTrangHT chỉ nhận \"Đang hợp tác\" hoặc \"Ngừng hợp tác\".", "khoa": "{MaNCC}; {TenNCC}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaNCC", "kieu": "INT", "rong": false, "y": "Mã nhà cung cấp", "pk": true, "fk": null}, {"ten": "TenNCC", "kieu": "NVARCHAR(200)", "rong": false, "y": "Tên công ty", "pk": false, "fk": null}, {"ten": "NguoiLienHeNCC", "kieu": "NVARCHAR(100)", "rong": true, "y": "Người liên hệ", "pk": false, "fk": null}, {"ten": "SDTNCC", "kieu": "VARCHAR(15)", "rong": true, "y": "Số điện thoại", "pk": false, "fk": null}, {"ten": "DiaChiNCC", "kieu": "NVARCHAR(300)", "rong": true, "y": "Địa chỉ", "pk": false, "fk": null}, {"ten": "MaSoThueNCC", "kieu": "VARCHAR(14)", "rong": true, "y": "Mã số thuế", "pk": false, "fk": null}, {"ten": "TinhTrangHT", "kieu": "NVARCHAR(20)", "rong": false, "y": "Tình trạng hợp tác", "pk": false, "fk": null}]}, {"ten": "MAGIAMGIA", "loai": "nghiep_vu", "moTa": "Mã giảm giá", "tanTu": "Mỗi mã giảm giá có mã nội bộ (MaMG) và mã khách nhập (CodeMG), cả hai không trùng. Mã thuộc một chương trình (TenChuongTrinh), giảm theo phần trăm hoặc theo số tiền (LoaiGiam, MucGiam), áp dụng cho đơn từ giá trị tối thiểu (DonToiThieu), giảm tối đa (GiamToiDa), trong thời gian từ NgayBatDau đến NgayKetThuc và dùng tối đa GioiHanLuot lượt. Mỗi mã ghi nhân viên tạo (MaNV) để biết ai chịu trách nhiệm về chương trình.", "rangBuoc": "CodeMG không rỗng, không trùng. LoaiGiam chỉ nhận \"Phần trăm\" hoặc \"Số tiền\". MucGiam lớn hơn 0; nếu theo phần trăm thì không quá 100. NgayKetThuc nếu có phải sau hoặc bằng NgayBatDau.", "khoa": "{MaMG}; {CodeMG}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaMG", "kieu": "INT", "rong": false, "y": "Mã nội bộ", "pk": true, "fk": null}, {"ten": "CodeMG", "kieu": "VARCHAR(30)", "rong": false, "y": "Mã khách nhập", "pk": false, "fk": null}, {"ten": "TenChuongTrinh", "kieu": "NVARCHAR(200)", "rong": false, "y": "Tên chương trình", "pk": false, "fk": null}, {"ten": "LoaiGiam", "kieu": "NVARCHAR(10)", "rong": false, "y": "Theo phần trăm hoặc theo số tiền", "pk": false, "fk": null}, {"ten": "MucGiam", "kieu": "DECIMAL(15,2)", "rong": false, "y": "Mức giảm", "pk": false, "fk": null}, {"ten": "DonToiThieu", "kieu": "DECIMAL(15,0)", "rong": true, "y": "Giá trị đơn tối thiểu", "pk": false, "fk": null}, {"ten": "GiamToiDa", "kieu": "DECIMAL(15,0)", "rong": true, "y": "Mức giảm tối đa", "pk": false, "fk": null}, {"ten": "NgayBatDau", "kieu": "DATE", "rong": true, "y": "Ngày bắt đầu áp dụng", "pk": false, "fk": null}, {"ten": "NgayKetThuc", "kieu": "DATE", "rong": true, "y": "Ngày hết hạn", "pk": false, "fk": null}, {"ten": "GioiHanLuot", "kieu": "INT", "rong": true, "y": "Số lượt dùng tối đa", "pk": false, "fk": null}, {"ten": "MaNV", "kieu": "INT", "rong": false, "y": "Nhân viên tạo mã", "pk": false, "fk": "NHANVIEN"}]}, {"ten": "DONHANG", "loai": "nghiep_vu", "moTa": "Đơn hàng", "tanTu": "Mỗi đơn hàng có mã (MaDH) và số đơn (SoDH) không trùng, ghi ngày giờ lập (ThoiDiemLap), kênh bán (KenhBan), nhân viên lập (MaNV, rỗng khi khách tự đặt trên trang web) và khách hàng (MaKH) nếu có. Đơn ghi khoản giảm giá và mã giảm giá đã dùng (MaMG); với đơn cần giao còn ghi tên, số điện thoại, địa chỉ người nhận và phí giao. Các giá trị này được chốt khi cửa hàng xác nhận đơn. Đơn có tình trạng (TinhTrangDH) và, với đơn đặt cọc, ghi điều kiện cọc đã thỏa thuận (DieuKienCoc).", "rangBuoc": "SoDH không trùng. KenhBan chỉ nhận \"Quầy\", \"Trang web\", \"Điện thoại\" hoặc \"Tin nhắn\". TinhTrangDH chỉ nhận \"Chờ xác nhận\", \"Đã xác nhận\", \"Đang chuẩn bị\", \"Đang giao\", \"Hoàn tất\" hoặc \"Đã hủy\". PhiGiao và GiamGia không âm. Mỗi đơn dùng tối đa một mã giảm giá. Đơn bán tại quầy không có người nhận hàng nên TenNguoiNhan, SDTNhan, DiaChiGiao rỗng. Đơn có KenhBan khác \"Trang web\" phải có MaNV. Khách tự hủy được đơn khi đơn còn \"Chờ xác nhận\"; sau khi cửa hàng xác nhận thì do cửa hàng xử lý.", "khoa": "{MaDH}; {SoDH}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaDH", "kieu": "INT", "rong": false, "y": "Mã đơn hàng", "pk": true, "fk": null}, {"ten": "SoDH", "kieu": "VARCHAR(20)", "rong": false, "y": "Số đơn hàng in trên phiếu", "pk": false, "fk": null}, {"ten": "ThoiDiemLap", "kieu": "DATETIME", "rong": false, "y": "Ngày giờ lập đơn", "pk": false, "fk": null}, {"ten": "KenhBan", "kieu": "NVARCHAR(20)", "rong": false, "y": "Quầy, trang web, điện thoại hoặc tin nhắn", "pk": false, "fk": null}, {"ten": "MaKH", "kieu": "INT", "rong": true, "y": "Khách hàng (rỗng nếu khách vãng lai)", "pk": false, "fk": "KHACHHANG"}, {"ten": "MaNV", "kieu": "INT", "rong": true, "y": "Nhân viên lập đơn (rỗng nếu khách tự đặt trên trang web)", "pk": false, "fk": "NHANVIEN"}, {"ten": "TenNguoiNhan", "kieu": "NVARCHAR(100)", "rong": true, "y": "Tên người nhận hàng", "pk": false, "fk": null}, {"ten": "SDTNhan", "kieu": "VARCHAR(15)", "rong": true, "y": "Số điện thoại người nhận", "pk": false, "fk": null}, {"ten": "DiaChiGiao", "kieu": "NVARCHAR(300)", "rong": true, "y": "Địa chỉ giao hàng", "pk": false, "fk": null}, {"ten": "PhiGiao", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Phí giao hàng", "pk": false, "fk": null}, {"ten": "GiamGia", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Số tiền giảm trên tiền hàng", "pk": false, "fk": null}, {"ten": "MaMG", "kieu": "INT", "rong": true, "y": "Mã giảm giá đã dùng", "pk": false, "fk": "MAGIAMGIA"}, {"ten": "TinhTrangDH", "kieu": "NVARCHAR(20)", "rong": false, "y": "Tình trạng đơn", "pk": false, "fk": null}, {"ten": "DieuKienCoc", "kieu": "NVARCHAR(300)", "rong": true, "y": "Điều kiện đặt cọc đã thỏa thuận", "pk": false, "fk": null}, {"ten": "GhiChuDH", "kieu": "NVARCHAR(500)", "rong": true, "y": "Ghi chú", "pk": false, "fk": null}]}, {"ten": "CHITIETDONHANG", "loai": "mkh", "moTa": "Chi tiết đơn hàng", "tanTu": "Mỗi dòng của đơn hàng được phân biệt bằng đơn (MaDH) và số thứ tự dòng (SoDongDH), cho biết mặt hàng (MaSP), số lượng (SoLuongBan) và đơn giá, tên hàng, SKU, thời hạn bảo hành đã chốt tại thời điểm bán (DonGiaChot, TenHangChot, SKUChot, ThoiHanBHChot). Một mặt hàng có thể ở nhiều dòng của cùng đơn nếu giá hoặc điều kiện bán khác nhau, vì vậy (MaDH, MaSP) không là khóa. Các giá trị chốt không đổi khi mặt hàng đổi giá, đổi tên hoặc đổi thời hạn bảo hành về sau.", "rangBuoc": "SoLuongBan lớn hơn 0. DonGiaChot không âm. ThoiHanBHChot từ 0 đến 120. Mỗi đơn có ít nhất một dòng. Tổng tiền hàng của đơn bằng tổng SoLuongBan x DonGiaChot của các dòng; đây là dữ liệu tính toán, không lưu.", "khoa": "{MaDH, SoDongDH}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaDH", "kieu": "INT", "rong": false, "y": "Đơn hàng", "pk": true, "fk": "DONHANG"}, {"ten": "SoDongDH", "kieu": "INT", "rong": false, "y": "Số thứ tự dòng trong đơn", "pk": true, "fk": null}, {"ten": "MaSP", "kieu": "INT", "rong": false, "y": "Mặt hàng bán", "pk": false, "fk": "MATHANG"}, {"ten": "SoLuongBan", "kieu": "INT", "rong": false, "y": "Số lượng", "pk": false, "fk": null}, {"ten": "DonGiaChot", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Đơn giá bán đã chốt", "pk": false, "fk": null}, {"ten": "TenHangChot", "kieu": "NVARCHAR(200)", "rong": false, "y": "Tên hàng đã chốt", "pk": false, "fk": null}, {"ten": "SKUChot", "kieu": "VARCHAR(50)", "rong": false, "y": "SKU đã chốt", "pk": false, "fk": null}, {"ten": "ThoiHanBHChot", "kieu": "INT", "rong": false, "y": "Thời hạn bảo hành đã chốt (tháng)", "pk": false, "fk": null}]}, {"ten": "THANHTOAN", "loai": "nghiep_vu", "moTa": "Thanh toán", "tanTu": "Mỗi lần thanh toán có mã (MaTT), thuộc một đơn hàng (MaDH), ghi loại khoản (LoaiKhoan: thanh toán hoặc đặt cọc), phương thức (PhuongThuc), số tiền, thời điểm, kết quả và, với giao dịch qua ngân hàng hoặc cổng thanh toán, mã giao dịch ngoài cùng đơn vị thanh toán. Một đơn có thể có nhiều lần thanh toán, kể cả cọc và phần còn lại. Nhân viên (MaNV) xác nhận đã nhận tiền sau khi đối chiếu; với khoản thu khi giao hàng, người giao (MaNVThu) là người đã thu tiền của khách.", "rangBuoc": "PhuongThuc chỉ nhận \"Tiền mặt\", \"Chuyển khoản\", \"Mã QR\", \"Thẻ ngân hàng\", \"Ví điện tử\", \"Cổng thanh toán\" hoặc \"Thu khi giao\". SoTien lớn hơn 0. Chỉ lần thanh toán có KetQuaTT là \"Thành công\" mới được tính là đã thu. Cặp (DonViThanhToan, MaGiaoDichNgoai) không trùng khi cả hai có giá trị. MaNVThu chỉ có khi PhuongThuc là \"Thu khi giao\".", "khoa": "{MaTT}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaTT", "kieu": "INT", "rong": false, "y": "Mã lần thanh toán", "pk": true, "fk": null}, {"ten": "MaDH", "kieu": "INT", "rong": false, "y": "Đơn hàng", "pk": false, "fk": "DONHANG"}, {"ten": "LoaiKhoan", "kieu": "NVARCHAR(15)", "rong": false, "y": "Thanh toán hoặc đặt cọc", "pk": false, "fk": null}, {"ten": "PhuongThuc", "kieu": "NVARCHAR(20)", "rong": false, "y": "Phương thức", "pk": false, "fk": null}, {"ten": "SoTien", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Số tiền", "pk": false, "fk": null}, {"ten": "ThoiDiemTT", "kieu": "DATETIME", "rong": false, "y": "Thời điểm", "pk": false, "fk": null}, {"ten": "KetQuaTT", "kieu": "NVARCHAR(15)", "rong": false, "y": "Thành công, thất bại hoặc chờ", "pk": false, "fk": null}, {"ten": "MaGiaoDichNgoai", "kieu": "VARCHAR(50)", "rong": true, "y": "Mã giao dịch của ngân hàng hoặc cổng thanh toán", "pk": false, "fk": null}, {"ten": "DonViThanhToan", "kieu": "NVARCHAR(50)", "rong": true, "y": "Ngân hàng, ví hoặc cổng thanh toán", "pk": false, "fk": null}, {"ten": "MaNV", "kieu": "INT", "rong": true, "y": "Nhân viên xác nhận đã nhận tiền", "pk": false, "fk": "NHANVIEN"}, {"ten": "MaNVThu", "kieu": "INT", "rong": true, "y": "Nhân viên giao hàng thu tiền (khoản thu khi giao)", "pk": false, "fk": "NHANVIEN"}]}, {"ten": "PHIEUGIAO", "loai": "nghiep_vu", "moTa": "Phiếu giao hàng", "tanTu": "Mỗi phiếu giao có mã (MaGiao), lập cho đúng một đơn cần giao (MaDH) và mỗi đơn chỉ có tối đa một phiếu giao. Phiếu ghi nhân viên giao hàng (MaNV), thời điểm xuất kho (ThoiDiemXuat) và tình trạng giao (TinhTrangGiao).", "rangBuoc": "MaDH không trùng. TinhTrangGiao chỉ nhận \"Đang giao\", \"Đã giao\" hoặc \"Không thành công\". Chỉ đơn có người nhận và địa chỉ giao mới có phiếu giao.", "khoa": "{MaGiao}; {MaDH}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaGiao", "kieu": "INT", "rong": false, "y": "Mã phiếu giao", "pk": true, "fk": null}, {"ten": "MaDH", "kieu": "INT", "rong": false, "y": "Đơn hàng được giao", "pk": false, "fk": "DONHANG"}, {"ten": "MaNV", "kieu": "INT", "rong": false, "y": "Nhân viên giao hàng", "pk": false, "fk": "NHANVIEN"}, {"ten": "ThoiDiemXuat", "kieu": "DATETIME", "rong": false, "y": "Thời điểm xuất kho giao đi", "pk": false, "fk": null}, {"ten": "TinhTrangGiao", "kieu": "NVARCHAR(20)", "rong": false, "y": "Tình trạng giao", "pk": false, "fk": null}]}, {"ten": "LANGIAO", "loai": "mkh", "moTa": "Lần giao hàng", "tanTu": "Mỗi lần thử giao của một phiếu giao được phân biệt bằng phiếu (MaGiao) và số lần (SoLan), ghi thời điểm, kết quả (KetQuaGiao), lý do nếu không thành công (LyDoThatBai) và nhân viên giao hàng thực hiện lần đó (MaNV). Mỗi đơn được thử giao tối đa 3 lần. Đây là mối kết hợp giữa phiếu giao và nhân viên; nhân viên phụ trách phiếu (PHIEUGIAO.MaNV) có thể khác người đi giao một lần cụ thể.", "rangBuoc": "SoLan từ 1 đến 3. LyDoThatBai không rỗng khi KetQuaGiao là \"Thất bại\". MaNV là nhân viên có chức vụ Giao hàng.", "khoa": "{MaGiao, SoLan}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaGiao", "kieu": "INT", "rong": false, "y": "Phiếu giao", "pk": true, "fk": "PHIEUGIAO"}, {"ten": "SoLan", "kieu": "INT", "rong": false, "y": "Lần giao thứ mấy (1 đến 3)", "pk": true, "fk": null}, {"ten": "ThoiDiemGiao", "kieu": "DATETIME", "rong": false, "y": "Thời điểm thử giao", "pk": false, "fk": null}, {"ten": "KetQuaGiao", "kieu": "NVARCHAR(20)", "rong": false, "y": "Thành công hoặc thất bại", "pk": false, "fk": null}, {"ten": "LyDoThatBai", "kieu": "NVARCHAR(300)", "rong": true, "y": "Lý do khách vắng hoặc từ chối nhận", "pk": false, "fk": null}, {"ten": "MaNV", "kieu": "INT", "rong": false, "y": "Nhân viên giao hàng thực hiện lần này", "pk": false, "fk": "NHANVIEN"}]}, {"ten": "PHIEUNHAP", "loai": "nghiep_vu", "moTa": "Phiếu nhập", "tanTu": "Mỗi phiếu nhập là một lần nhận hàng thực tế, có mã (MaPN) và số phiếu (SoPhieu) không trùng, ghi nhà cung cấp (MaNCC), nhân viên lập (MaNV), thời điểm nhận, tình trạng phiếu, nhân viên và thời điểm xác nhận phiếu, số hóa đơn của nhà cung cấp và ghi chú.", "rangBuoc": "SoPhieu không trùng. TinhTrangPN chỉ nhận \"Nháp\", \"Đã xác nhận\" hoặc \"Đã hủy\". Phiếu có ít nhất một dòng; hàng chỉ được ghi tăng vào kho một lần khi phiếu chuyển sang \"Đã xác nhận\". Phiếu \"Đã xác nhận\" phải có MaNVXacNhan và ThoiDiemXacNhan; hai cột này cùng rỗng hoặc cùng có giá trị.", "khoa": "{MaPN}; {SoPhieu}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaPN", "kieu": "INT", "rong": false, "y": "Mã phiếu nhập", "pk": true, "fk": null}, {"ten": "SoPhieu", "kieu": "VARCHAR(20)", "rong": false, "y": "Số phiếu nhập", "pk": false, "fk": null}, {"ten": "MaNCC", "kieu": "INT", "rong": false, "y": "Nhà cung cấp", "pk": false, "fk": "NHACUNGCAP"}, {"ten": "MaNV", "kieu": "INT", "rong": false, "y": "Nhân viên kho lập phiếu", "pk": false, "fk": "NHANVIEN"}, {"ten": "ThoiDiemNhan", "kieu": "DATETIME", "rong": false, "y": "Thời điểm nhận hàng", "pk": false, "fk": null}, {"ten": "TinhTrangPN", "kieu": "NVARCHAR(20)", "rong": false, "y": "Tình trạng phiếu", "pk": false, "fk": null}, {"ten": "MaNVXacNhan", "kieu": "INT", "rong": true, "y": "Nhân viên xác nhận phiếu", "pk": false, "fk": "NHANVIEN"}, {"ten": "ThoiDiemXacNhan", "kieu": "DATETIME", "rong": true, "y": "Thời điểm xác nhận", "pk": false, "fk": null}, {"ten": "SoHoaDonNCC", "kieu": "VARCHAR(30)", "rong": true, "y": "Số hóa đơn của nhà cung cấp", "pk": false, "fk": null}, {"ten": "GhiChuPN", "kieu": "NVARCHAR(500)", "rong": true, "y": "Ghi chú", "pk": false, "fk": null}]}, {"ten": "CHITIETPHIEUNHAP", "loai": "mkh", "moTa": "Chi tiết phiếu nhập", "tanTu": "Mỗi dòng của phiếu nhập được phân biệt bằng phiếu (MaPN) và số thứ tự dòng (SoDongPN), cho biết mặt hàng (MaSP), số lượng thực nhận (SoLuongNhap) và giá nhập (GiaNhap). Cùng một mặt hàng có thể ở nhiều dòng nếu khác giá hoặc khác lô.", "rangBuoc": "SoLuongNhap lớn hơn 0. GiaNhap không âm.", "khoa": "{MaPN, SoDongPN}", "truoc": "BCNF", "sau": "BCNF", "cot": [{"ten": "MaPN", "kieu": "INT", "rong": false, "y": "Phiếu nhập", "pk": true, "fk": "PHIEUNHAP"}, {"ten": "SoDongPN", "kieu": "INT", "rong": false, "y": "Số thứ tự dòng trong phiếu", "pk": true, "fk": null}, {"ten": "MaSP", "kieu": "INT", "rong": false, "y": "Mặt hàng nhập", "pk": false, "fk": "MATHANG"}, {"ten": "SoLuongNhap", "kieu": "INT", "rong": false, "y": "Số lượng thực nhận", "pk": false, "fk": null}, {"ten": "GiaNhap", "kieu": "DECIMAL(15,0)", "rong": false, "y": "Giá nhập một đơn vị", "pk": false, "fk": null}]}, {"ten": "HANGCOSERI", "loai": "nghiep_vu", "moTa": "Chiếc hàng có số seri (thông tin nhập và bán)", "tanTu": "Mỗi chiếc hàng có số seri được phân biệt bằng mã nội bộ (MaSeri) và có hồ sơ nhận diện ở SERIMATHANG. Quan hệ này ghi chiếc hàng nhập về theo dòng nào của phiếu nhập (MaPN, SoDongPN), khi đã bán thì ghi dòng đơn của lần bán gần nhất (MaDH, SoDongDH), tình trạng hiện tại và thời điểm nhập kho.", "rangBuoc": "Mặt hàng của chiếc (SERIMATHANG.MaSP) phải bằng MaSP của dòng nhập và của dòng đơn nếu có. MaDH và SoDongDH cùng rỗng hoặc cùng có giá trị. Chiếc trả về rồi bán lại thì hai cột này chuyển sang lần bán mới; lần bán trước vẫn tra được ở dòng trả (CHITIETTRA) và phiếu bảo hành.", "khoa": "{MaSeri}", "truoc": "3NF", "sau": "BCNF", "cot": [{"ten": "MaSeri", "kieu": "INT", "rong": false, "y": "Mã nội bộ của chiếc hàng", "pk": true, "fk": "SERIMATHANG"}, {"ten": "MaPN", "kieu": "INT", "rong": false, "y": "Phiếu nhập chiếc này về", "pk": false, "fk": "CHITIETPHIEUNHAP"}, {"ten": "SoDongPN", "kieu": "INT", "rong": false, "y": "Dòng của phiếu nhập", "pk": false, "fk": "CHITIETPHIEUNHAP"}, {"ten": "MaDH", "kieu": "INT", "rong": true, "y": "Đơn của lần bán gần nhất", "pk": false, "fk": "CHITIETDONHANG"}, {"ten": "SoDongDH", "kieu": "INT", "rong": true, "y": "Dòng đơn của lần bán gần nhất", "pk": false, "fk": "CHITIETDONHANG"}, {"ten": "TinhTrangSeri", "kieu": "NVARCHAR(20)", "rong": false, "y": "Trong kho, đã bán, chờ kiểm tra...", "pk": false, "fk": null}, {"ten": "ThoiDiemNhap", "kieu": "DATETIME", "rong": false, "y": "Thời điểm ghi seri vào kho", "pk": false, "fk": null}]}, {"ten": "SERIMATHANG", "loai": "nghiep_vu", "moTa": "Nhận diện chiếc hàng (số seri theo mặt hàng)", "tanTu": "Mỗi chiếc hàng có số seri được phân biệt bằng mã nội bộ (MaSeri), ghi số seri (SoSeri) và mặt hàng (MaSP). Số seri là duy nhất trong cùng mặt hàng nên (MaSP, SoSeri) cũng xác định chiếc hàng.", "rangBuoc": "Cặp (MaSP, SoSeri) không trùng. Mặt hàng phải có CoSeri = 1.", "khoa": "{MaSeri}; {SoSeri, MaSP}", "truoc": "—", "sau": "BCNF", "cot": [{"ten": "MaSeri", "kieu": "INT", "rong": false, "y": "Mã nội bộ của chiếc hàng", "pk": true, "fk": null}, {"ten": "SoSeri", "kieu": "VARCHAR(60)", "rong": false, "y": "Số seri in trên sản phẩm", "pk": false, "fk": null}, {"ten": "MaSP", "kieu": "INT", "rong": false, "y": "Mặt hàng của chiếc này", "pk": false, "fk": "MATHANG"}]}, {"ten": "GIAODICHKHO", "loai": "nghiep_vu", "moTa": "Giao dịch kho", "tanTu": "Mỗi lần hàng vào hoặc ra kho (nhập, bán, nhận lại) là một giao dịch kho có mã (MaGDK); mỗi lần chuyển nhóm là hai giao dịch đối ứng (chuyển ra khỏi nhóm cũ, chuyển vào nhóm mới). Mỗi giao dịch ghi mặt hàng, nhóm kho bị ảnh hưởng, loại biến động, số lượng, thời điểm, nhân viên thực hiện và chứng từ gốc. Số lượng hàng trong kho được tính từ các giao dịch này, không lưu thành một cột riêng.", "rangBuoc": "SoLuongGD lớn hơn 0; Nhập, Nhận lại, Chuyển vào làm tăng, Xuất bán, Chuyển ra làm giảm. NhomKho chỉ nhận \"Đủ điều kiện bán\", \"Chờ kiểm tra\" hoặc \"Chờ xử lý\". Chuyển ra và Chuyển vào ghi thành cặp cùng mặt hàng, số lượng và chứng từ; số lượng tính được của : 4, "mach": ["GIATRITHONGSO", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết giá trị thông số thuộc mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 5, "sql": "SELECT gt.MaSP, gt.MaTS, th.MaTH\nFROM GIATRITHONGSO gt\nJOIN MATHANG mh ON gt.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 5, "mach": ["GIATRITHONGSO", "DINHNGHIATHONGSO", "LOAIHANG"], "yNghia": "Cho biết giá trị thông số ứng với thông số nào; thông số đó do loại hàng nào quy định.", "dong": 5, "sql": "SELECT gt.MaSP, gt.MaTS, lh.MaLoai\nFROM GIATRITHONGSO gt\nJOIN DINHNGHIATHONGSO dn ON gt.MaTS = dn.MaTS\nJOIN LOAIHANG lh ON dn.MaLoai = lh.MaLoai;"}, {"so": 6, "mach": ["TAIKHOAN", "KHACHHANG"], "yNghia": "Cho biết tài khoản thuộc khách hàng nào (nếu là tài khoản khách).", "dong": 3, "sql": "SELECT tk.MaTK, kh.MaKH\nFROM TAIKHOAN tk\nJOIN KHACHHANG kh ON tk.MaKH = kh.MaKH;"}, {"so": 7, "mach": ["TAIKHOAN", "NHANVIEN"], "yNghia": "Cho biết tài khoản thuộc nhân viên nào (nếu là tài khoản nhân viên).", "dong": 3, "sql": "SELECT tk.MaTK, nv.MaNV\nFROM TAIKHOAN tk\nJOIN NHANVIEN nv ON tk.MaNV = nv.MaNV;"}, {"so": 8, "mach": ["LANGIAO", "NHANVIEN"], "yNghia": "Cho biết lần giao hàng do nhân viên nào giao.", "dong": 4, "sql": "SELECT lg.MaGiao, lg.SoLan, nv.MaNV\nFROM LANGIAO lg\nJOIN NHANVIEN nv ON lg.MaNV = nv.MaNV;"}, {"so": 9, "mach": ["LANGIAO", "PHIEUGIAO", "NHANVIEN"], "yNghia": "Cho biết lần giao hàng thuộc phiếu giao nào; phiếu giao đó do nhân viên nào giao.", "dong": 4, "sql": "SELECT lg.MaGiao, lg.SoLan, nv.MaNV\nFROM LANGIAO lg\nJOIN PHIEUGIAO pg ON lg.MaGiao = pg.MaGiao\nJOIN NHANVIEN nv ON pg.MaNV = nv.MaNV;"}, {"so": 10, "mach": ["LANGIAO", "PHIEUGIAO", "DONHANG", "KHACHHANG"], "yNghia": "Cho biết lần giao hàng thuộc phiếu giao nào; phiếu giao đó lập cho đơn hàng nào; đơn hàng đó do khách hàng nào đặt (nếu có hồ sơ khách).", "dong": 4, "sql": "SELECT lg.MaGiao, lg.SoLan, dh.MaDH, kh.MaKH\nFROM LANGIAO lg\nJOIN PHIEUGIAO pg ON lg.MaGiao = pg.MaGiao\nJOIN DONHANG dh ON pg.MaDH = dh.MaDH\nJOIN KHACHHANG kh ON dh.MaKH = kh.MaKH;"}, {"so": 11, "mach": ["LANGIAO", "PHIEUGIAO", "DONHANG", "NHANVIEN"], "yNghia": "Cho biết lần giao hàng thuộc phiếu giao nào; phiếu giao đó lập cho đơn hàng nào; đơn hàng đó do nhân viên nào lập.", "dong": 1, "sql": "SELECT lg.MaGiao, lg.SoLan, dh.MaDH, nv.MaNV\nFROM LANGIAO lg\nJOIN PHIEUGIAO pg ON lg.MaGiao = pg.MaGiao\nJOIN DONHANG dh ON pg.MaDH = dh.MaDH\nJOIN NHANVIEN nv ON dh.MaNV = nv.MaNV;"}, {"so": 12, "mach": ["LANGIAO", "PHIEUGIAO", "DONHANG", "MAGIAMGIA", "NHANVIEN"], "yNghia": "Cho biết lần giao hàng thuộc phiếu giao nào; phiếu giao đó lập cho đơn hàng nào; đơn hàng đó áp dụng mã giảm giá nào (nếu có); mã giảm giá đó do nhân viên nào tạo.", "dong": 1, "sql": "SELECT lg.MaGiao, lg.SoLan, dh.MaDH, mg.MaMG, nv.MaNV\nFROM LANGIAO lg\nJOIN PHIEUGIAO pg ON lg.MaGiao = pg.MaGiao\nJOIN DONHANG dh ON pg.MaDH = dh.MaDH\nJOIN MAGIAMGIA mg ON dh.MaMG = mg.MaMG\nJOIN NHANVIEN nv ON mg.MaNV = nv.MaNV;"}, {"so": 13, "mach": ["GIAODICHKHO", "MATHANG", "LOAIHANG"], "yNghia": "Cho biết giao dịch kho liên quan đến mặt hàng nào; mặt hàng đó thuộc loại hàng nào.", "dong": 6, "sql": "SELECT gd.MaGDK, mh.MaSP, lh.MaLoai\nFROM GIAODICHKHO gd\nJOIN MATHANG mh ON gd.MaSP = mh.MaSP\nJOIN LOAIHANG lh ON mh.MaLoai = lh.MaLoai;"}, {"so": 14, "mach": ["GIAODICHKHO", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết giao dịch kho liên quan đến mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 6, "sql": "SELECT gd.MaGDK, mh.MaSP, th.MaTH\nFROM GIAODICHKHO gd\nJOIN MATHANG mh ON gd.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 15, "mach": ["GIAODICHKHO", "NHANVIEN"], "yNghia": "Cho biết giao dịch kho do nhân viên nào thực hiện.", "dong": 6, "sql": "SELECT gd.MaGDK, nv.MaNV\nFROM GIAODICHKHO gd\nJOIN NHANVIEN nv ON gd.MaNV = nv.MaNV;"}, {"so": 16, "mach": ["CHITIETTRA", "HANGCOSERI", "MATHANG", "LOAIHANG"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó là chiếc của mặt hàng nào; mặt hàng đó thuộc loại hàng nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, mh.MaSP, lh.MaLoai\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN MATHANG mh ON sm.MaSP = mh.MaSP\nJOIN LOAIHANG lh ON mh.MaLoai = lh.MaLoai;"}, {"so": 17, "mach": ["CHITIETTRA", "HANGCOSERI", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó là chiếc của mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, mh.MaSP, th.MaTH\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN MATHANG mh ON sm.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 18, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETDONHANG", "MATHANG", "LOAIHANG"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó bán mặt hàng nào; mặt hàng đó thuộc loại hàng nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, ct.MaDH, ct.SoDongDH, mh.MaSP, lh.MaLoai\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN MATHANG mh ON ct.MaSP = mh.MaSP\nJOIN LOAIHANG lh ON mh.MaLoai = lh.MaLoai;"}, {"so": 19, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETDONHANG", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó bán mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, ct.MaDH, ct.SoDongDH, mh.MaSP, th.MaTH\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN MATHANG mh ON ct.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 20, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETDONHANG", "DONHANG", "KHACHHANG"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó thuộc đơn hàng nào; đơn hàng đó do khách hàng nào đặt (nếu có hồ sơ khách).", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, ct.MaDH, ct.SoDongDH, kh.MaKH\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN DONHANG dh ON ct.MaDH = dh.MaDH\nJOIN KHACHHANG kh ON dh.MaKH = kh.MaKH;"}, {"so": 21, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETDONHANG", "DONHANG", "NHANVIEN"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó thuộc đơn hàng nào; đơn hàng đó do nhân viên nào lập.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, ct.MaDH, ct.SoDongDH, nv.MaNV\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN DONHANG dh ON ct.MaDH = dh.MaDH\nJOIN NHANVIEN nv ON dh.MaNV = nv.MaNV;"}, {"so": 22, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETDONHANG", "DONHANG", "MAGIAMGIA", "NHANVIEN"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó thuộc đơn hàng nào; đơn hàng đó áp dụng mã giảm giá nào (nếu có); mã giảm giá đó do nhân viên nào tạo.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, ct.MaDH, ct.SoDongDH, mg.MaMG, nv.MaNV\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN DONHANG dh ON ct.MaDH = dh.MaDH\nJOIN MAGIAMGIA mg ON dh.MaMG = mg.MaMG\nJOIN NHANVIEN nv ON mg.MaNV = nv.MaNV;"}, {"so": 23, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETPHIEUNHAP", "MATHANG", "LOAIHANG"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó nhập mặt hàng nào; mặt hàng đó thuộc loại hàng nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, cp.MaPN, cp.SoDongPN, mh.MaSP, lh.MaLoai\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN MATHANG mh ON cp.MaSP = mh.MaSP\nJOIN LOAIHANG lh ON mh.MaLoai = lh.MaLoai;"}, {"so": 24, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETPHIEUNHAP", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó nhập mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, cp.MaPN, cp.SoDongPN, mh.MaSP, th.MaTH\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN MATHANG mh ON cp.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 25, "mach": ["CHITIETTRA", "HANGCOSERI", "CHITIETPHIEUNHAP", "PHIEUNHAP", "NHANVIEN"], "yNghia": "Cho biết dòng trả hàng ghi chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó thuộc phiếu nhập nào; phiếu nhập đó do nhân viên kho nào lập.", "dong": 1, "sql": "SELECT cr.MaHS, cr.SoDongTra, hs.MaSeri, cp.MaPN, cp.SoDongPN, nv.MaNV\nFROM CHITIETTRA cr\nJOIN HANGCOSERI hs ON cr.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN PHIEUN mach": ["KHOANHOAN", "PHIEUBAOHANH", "HANGCOSERI", "CHITIETDONHANG", "DONHANG", "MAGIAMGIA", "NHANVIEN"], "yNghia": "Cho biết khoản hoàn tiền theo phiếu bảo hành nào (nếu do bảo hành thu hồi); phiếu bảo hành đó ứng với chiếc hàng có seri nào; chiếc hàng có seri đó bán gần nhất ở dòng đơn nào; dòng đơn đó thuộc đơn hàng nào; đơn hàng đó áp dụng mã giảm giá nào (nếu có); mã giảm giá đó do nhân viên nào tạo.", "dong": 1, "sql": "SELECT kc.MaHoan, bh.MaPhieuBH, hs.MaSeri, ct.MaDH, ct.SoDongDH, mg.MaMG, nv.MaNV\nFROM KHOANHOAN kc\nJOIN PHIEUBAOHANH bh ON kc.MaPhieuBH = bh.MaPhieuBH\nJOIN HANGCOSERI hs ON bh.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETDONHANG ct ON hs.MaDH = ct.MaDH AND hs.SoDongDH = ct.SoDongDH\nJOIN DONHANG dh ON ct.MaDH = dh.MaDH\nJOIN MAGIAMGIA mg ON dh.MaMG = mg.MaMG\nJOIN NHANVIEN nv ON mg.MaNV = nv.MaNV;"}, {"so": 58, "mach": ["KHOANHOAN", "PHIEUBAOHANH", "HANGCOSERI", "CHITIETPHIEUNHAP", "MATHANG", "LOAIHANG"], "yNghia": "Cho biết khoản hoàn tiền theo phiếu bảo hành nào (nếu do bảo hành thu hồi); phiếu bảo hành đó ứng với chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó nhập mặt hàng nào; mặt hàng đó thuộc loại hàng nào.", "dong": 1, "sql": "SELECT kc.MaHoan, bh.MaPhieuBH, hs.MaSeri, cp.MaPN, cp.SoDongPN, mh.MaSP, lh.MaLoai\nFROM KHOANHOAN kc\nJOIN PHIEUBAOHANH bh ON kc.MaPhieuBH = bh.MaPhieuBH\nJOIN HANGCOSERI hs ON bh.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN MATHANG mh ON cp.MaSP = mh.MaSP\nJOIN LOAIHANG lh ON mh.MaLoai = lh.MaLoai;"}, {"so": 59, "mach": ["KHOANHOAN", "PHIEUBAOHANH", "HANGCOSERI", "CHITIETPHIEUNHAP", "MATHANG", "THUONGHIEU"], "yNghia": "Cho biết khoản hoàn tiền theo phiếu bảo hành nào (nếu do bảo hành thu hồi); phiếu bảo hành đó ứng với chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó nhập mặt hàng nào; mặt hàng đó mang thương hiệu nào.", "dong": 1, "sql": "SELECT kc.MaHoan, bh.MaPhieuBH, hs.MaSeri, cp.MaPN, cp.SoDongPN, mh.MaSP, th.MaTH\nFROM KHOANHOAN kc\nJOIN PHIEUBAOHANH bh ON kc.MaPhieuBH = bh.MaPhieuBH\nJOIN HANGCOSERI hs ON bh.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN MATHANG mh ON cp.MaSP = mh.MaSP\nJOIN THUONGHIEU th ON mh.MaTH = th.MaTH;"}, {"so": 60, "mach": ["KHOANHOAN", "PHIEUBAOHANH", "HANGCOSERI", "CHITIETPHIEUNHAP", "PHIEUNHAP", "NHANVIEN"], "yNghia": "Cho biết khoản hoàn tiền theo phiếu bảo hành nào (nếu do bảo hành thu hồi); phiếu bảo hành đó ứng với chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó thuộc phiếu nhập nào; phiếu nhập đó do nhân viên kho nào lập.", "dong": 1, "sql": "SELECT kc.MaHoan, bh.MaPhieuBH, hs.MaSeri, cp.MaPN, cp.SoDongPN, nv.MaNV\nFROM KHOANHOAN kc\nJOIN PHIEUBAOHANH bh ON kc.MaPhieuBH = bh.MaPhieuBH\nJOIN HANGCOSERI hs ON bh.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN PHIEUNHAP pn ON cp.MaPN = pn.MaPN\nJOIN NHANVIEN nv ON pn.MaNV = nv.MaNV;"}, {"so": 61, "mach": ["KHOANHOAN", "PHIEUBAOHANH", "HANGCOSERI", "CHITIETPHIEUNHAP", "PHIEUNHAP", "NHACUNGCAP"], "yNghia": "Cho biết khoản hoàn tiền theo phiếu bảo hành nào (nếu do bảo hành thu hồi); phiếu bảo hành đó ứng với chiếc hàng có seri nào; chiếc hàng có seri đó nhập về ở dòng phiếu nhập nào; dòng phiếu nhập đó thuộc phiếu nhập nào; phiếu nhập đó nhận từ nhà cung cấp nào.", "dong": 1, "sql": "SELECT kc.MaHoan, bh.MaPhieuBH, hs.MaSeri, cp.MaPN, cp.SoDongPN, nc.MaNCC\nFROM KHOANHOAN kc\nJOIN PHIEUBAOHANH bh ON kc.MaPhieuBH = bh.MaPhieuBH\nJOIN HANGCOSERI hs ON bh.MaSeri = hs.MaSeri\nJOIN SERIMATHANG sm ON sm.MaSeri = hs.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON hs.MaPN = cp.MaPN AND hs.SoDongPN = cp.SoDongPN\nJOIN PHIEUNHAP pn ON cp.MaPN = pn.MaPN\nJOIN NHACUNGCAP nc ON pn.MaNCC = nc.MaNCC;"}], "khaiThac": [{"ma": "K1", "ten": "Lịch sử mua hàng của một khách theo số điện thoại", "duong": "KHACHHANG ⇒ DONHANG ⇒ CHITIETDONHANG", "dong": 3, "sql": "SELECT dh.SoDH, dh.ThoiDiemLap, ct.SoDongDH, ct.TenHangChot, ct.SoLuongBan, ct.DonGiaChot,\n       ct.SoLuongBan * ct.DonGiaChot AS ThanhTien\nFROM KHACHHANG kh\nJOIN DONHANG dh ON dh.MaKH = kh.MaKH\nJOIN CHITIETDONHANG ct ON ct.MaDH = dh.MaDH\nWHERE kh.SDTKH = '0900000001'\nORDER BY dh.ThoiDiemLap, ct.SoDongDH;"}, {"ma": "K2", "ten": "Doanh thu tiền hàng theo loại hàng trong tháng 10/2026 (chỉ tính đơn đã hoàn tất, chưa trừ giảm giá và hoàn tiền)", "duong": "CHITIETDONHANG → DONHANG; CHITIETDONHANG → MATHANG → LOAIHANG", "dong": 3, "sql": "SELECT lh.MaLoai, lh.TenLoai, SUM(ct.SoLuongBan * ct.DonGiaChot) AS DoanhThuTienHang\nFROM CHITIETDONHANG ct\nJOIN DONHANG dh ON dh.MaDH = ct.MaDH\nJOIN MATHANG mh ON mh.MaSP = ct.MaSP\nJOIN LOAIHANG lh ON lh.MaLoai = mh.MaLoai\nWHERE dh.TinhTrangDH = 'Hoàn tất'\n  AND dh.ThoiDiemLap >= '2026-10-01' AND dh.ThoiDiemLap < '2026-11-01'\nGROUP BY lh.MaLoai, lh.TenLoai\nORDER BY DoanhThuTienHang DESC;"}, {"ma": "K3", "ten": "Số lượng hàng trong kho theo mặt hàng và nhóm kho, tính từ giao dịch kho", "duong": "GIAODICHKHO → MATHANG", "dong": 4, "sql": "SELECT mh.MaSP, mh.TenSP, gd.NhomKho,\n       SUM(CASE WHEN gd.LoaiBienDong IN ('Nhập', 'Nhận lại', 'Chuyển vào') THEN gd.SoLuongGD\n                ELSE -gd.SoLuongGD END) AS SoLuong\nFROM GIAODICHKHO gd\nJOIN MATHANG mh ON mh.MaSP = gd.MaSP\nGROUP BY mh.MaSP, mh.TenSP, gd.NhomKho\nORDER BY mh.MaSP, gd.NhomKho;"}, {"ma": "K4", "ten": "Truy vết một chiếc hàng theo số seri: nhập từ đâu, lần bán gần nhất cho ai", "duong": "SERIMATHANG ⇒ HANGCOSERI → CHITIETPHIEUNHAP → PHIEUNHAP → NHACUNGCAP; HANGCOSERI → CHITIETDONHANG → DONHANG → KHACHHANG", "dong": 1, "sql": "SELECT sm.SoSeri, mh.TenSP, pn.SoPhieu, nc.TenNCC, dh.SoDH, kh.HoLotKH, kh.TenKH\nFROM SERIMATHANG sm\nJOIN MATHANG mh ON mh.MaSP = sm.MaSP\nJOIN HANGCOSERI hs ON hs.MaSeri = sm.MaSeri\nJOIN CHITIETPHIEUNHAP cp ON cp.MaPN = hs.MaPN AND cp.SoDongPN = hs.SoDongPN\nJOIN PHIEUNHAP pn ON pn.MaPN = cp.MaPN\nJOIN NHACUNGCAP nc ON nc.MaNCC = pn.MaNCC\nLEFT JOIN CHITIETDONHANG ct ON ct.MaDH = hs.MaDH AND ct.SoDongDH = hs.SoDongDH\nLEFT JOIN DONHANG dh ON dh.MaDH = ct.MaDH\nLEFT JOIN KHACHHANG kh ON kh.MaKH = dh.MaKH\nWHERE sm.MaSP = 2 AND sm.SoSeri = 'S1T-0001';"}, {"ma": "K5", "ten": "Các dòng trả của từng hồ sơ đổi trả trong một đơn, kèm tổng tiền đã chi hoàn của hồ sơ", "duong": "HOSODOITRA ⇒ CHITIETTRA; HOSODOITRA ⇒ KHOANHOAN", "dong": 1, "sql": "SELECT hd.MaHS, hd.LoaiTruongHop, ct.SoDongTra, ct.SoDongDH, ct.SoLuongTra, h.TongHoan\nFROM HOSODOITRA hd\nJOIN CHITIETTRA ct ON ct.MaHS = hd.MaHS\nLEFT JOIN (SELECT MaHS, SUM(SoTienHoan) AS TongHoan\n           FROM KHOANHOAN\n           WHERE MaHS IS NOT NULL AND ThoiDiemChi IS NOT NULL\n           GROUP BY MaHS) h ON h.MaHS = hd.MaHS\nWHERE hd.MaDH = 2\nORDER BY hd.MaHS, ct.SoDongTra;"}, {"ma": "K6", "ten": "Ai đã lập đơn, xác nhận tiền, thu tiền khi giao và giao một đơn hàng, và người đó có chức vụ gì (truy trách nhiệm)", "duong": "DONHANG → NHANVIEN (lập); DONHANG ⇐ THANHTOAN → NHANVIEN (xác nhận tiền, cột MaNV; thu khi giao, cột MaNVThu); DONHANG ⇐ PHIEUGIAO → NHANVIEN (giao)", "dong": 1, "sql": "SELECT dh.SoDH, nl.HoLotNV AS HoLotNguoiLap, nl.TenNV AS TenNguoiLap, nl.ChucVu AS ChucVuNguoiLap,\n       tt.MaTT, tt.PhuongThuc, nx.HoLotNV AS HoLotNguoiXacNhan, nx.TenNV AS TenNguoiXacNhan, nx.ChucVu AS ChucVuNguoiXacNhan,\n       nt.HoLotNV AS HoLotNguoiThu, nt.TenNV AS TenNguoiThu, nt.ChucVu AS ChucVuNguoiThu,\n       pg.MaGiao, ng.HoLotNV AS HoLotNguoiGiao, ng.TenNV AS TenNguoiGiao, ng.ChucVu AS ChucVuNguoiGiao\nFROM DONHANG dh\nLEFT JOIN NHANVIEN nl ON nl.MaNV = dh.MaNV\nLEFT JOIN THANHTOAN tt ON tt.MaDH = dh.MaDH\nLEFT JOIN NHANVIEN nx ON nx.MaNV = tt.MaNV\nLEFT JOIN NHANVIEN nt ON nt.MaNV = tt.MaNVThu\nLEFT JOIN PHIEUGIAO pg ON pg.MaDH = dh.MaDH\nLEFT JOIN NHANVIEN ng ON ng.MaNV = pg.MaNV\nWHERE dh.SoDH = 'DH-0002';"}, {"ma": "K7", "ten": "Các khoản hoàn tiền trong tháng 10/2026: ai duyệt, ai chi tiền", "duong": "KHOANHOAN → NHANVIEN (người duyệt, cột MaNV); KHOANHOAN → NHANVIEN (người chi, cột MaNVChi)", "dong": 2, "sql": "SELECT kc.MaHoan, kc.SoTienHoan, kc.ThoiDiemDuyetHoan, nd.HoLotNV AS HoLotNguoiDuyet, nd.TenNV AS TenNguoiDuyet,\n       kc.ThoiDiemChi, nc.HoLotNV AS HoLotNguoiChi, nc.TenNV AS TenNguoiChi\nFROM KHOANHOAN kc\nJOIN NHANVIEN nd ON nd.MaNV = kc.MaNV\nLEFT JOIN NHANVIEN nc ON nc.MaNV = kc.MaNVChi\nWHERE kc.ThoiDiemDuyetHoan >= '2026-10-01' AND kc.ThoiDiemDuyetHoan < '2026-11-01'\nORDER BY kc.ThoiDiemDuyetHoan;"}, {"ma": "K8", "ten": "Danh sách nhân viên còn làm việc theo chức vụ", "duong": "NHANVIEN (tra theo thuộc tính ChucVu, không nối quan hệ khác)", "dong": 7, "sql": "SELECT nv.ChucVu, nv.MaNV, nv.HoLotNV, nv.TenNV, nv.NgayVaoLam\nFROM NHANVIEN nv\nWHERE nv.TinhTrangNV = 'Đang làm'\nORDER BY nv.ChucVu, nv.MaNV;"}, {"ma": "K9", "ten": "Phiếu bảo hành đã quá ngày hẹn trả mà chưa trả khách, kèm khách cần liên hệ", "duong": "PHIEUBAOHANH → CHITIETDONHANG → DONHANG → KHACHHANG", "dong": 1, "sql": "WITH ThamSo AS (SELECT '2026-11-01' AS NgayTraCuu)\nSELECT bh.MaPhieuBH, bh.NgayNhan, bh.NgayHenTra, bh.TinhTrangBH, ct.TenHangChot, dh.SoDH, kh.HoLotKH, kh.TenKH, kh.SDTKH\nFROM PHIEUBAOHANH bh\nCROSS JOIN ThamSo ts\nJOIN CHITIETDONHANG ct ON ct.MaDH = bh.MaDH AND ct.SoDongDH = bh.SoDongDH\nJOIN DONHANG dh ON dh.MaDH = ct.MaDH\nLEFT JOIN KHACHHANG kh ON kh.MaKH = dh.MaKH\nWHERE bh.NgayTraThucTe IS NULL AND bh.NgayHenTra < ts.NgayTraCuu\nORDER BY bh.NgayHenTra;"}], "taoBang": "-- Lược đồ sau cải tiến của PowerTech (26 quan hệ). Sinh bằng tools/sql_gen.py từ tools/luoc_do.py.\n-- Tiền tệ là đồng Việt Nam (DECIMAL(15,0)). Khóa chính số nguyên tự tăng do ứng dụng cấp.\n-- SQL Server 2019 trở lên: tạo CSDL với COLLATE Vietnamese_100_CI_AS_SC_UTF8 để chuỗi tiếng Việt không có tiền tố N giữ đúng dấu.\n\nCREATE TABLE LOAIHANG (  -- Loại hàng\n    MaLoai INT NOT NULL,\n    TenLoai NVARCHAR(100) NOT NULL,\n    MoTaLoai NVARCHAR(500) NULL,\n    MaLoaiCha INT NULL,\n    CONSTRAINT PK_LOAIHANG PRIMARY KEY (MaLoai),\n    CONSTRAINT FK_LOAIHANG_MaLoaiCha FOREIGN KEY (MaLoaiCha) REFERENCES LOAIHANG(MaLoai),\n    CONSTRAINT CK_LOAIHANG_1 CHECK (MaLoaiCha IS NULL OR MaLoaiCha <> MaLoai)\n);\n\nCREATE TABLE THUONGHIEU (  -- Thương hiệu\n    MaTH INT NOT NULL,\n    TenTH NVARCHAR(100) NOT NULL,\n    MoTaTH NVARCHAR(500) NULL,\n    CONSTRAINT PK_THUONGHIEU PRIMARY KEY (MaTH),\n    CONSTRAINT UQ_THUONGHIEU_TenTH UNIQUE (TenTH)\n);\n\nCREATE TABLE MATHANG (  -- Mặt hàng\n    MaSP INT NOT NULL,\n    SKU VARCHAR(50) NOT NULL,\n    TenSP NVARCHAR(200) NOT NULL,\n    MoTaSP NVARCHAR(2000) NULL,\n    GiaNiemYet DECIMAL(15,0) NOT NULL,\n    GiaKhuyenMai DECIMAL(15,0) NULL,\n    ThoiHanBH INT NOT NULL,\n    TinhTrangKD NVARCHAR(20) NOT NULL,\n    CoSeri BIT NOT NULL,\n    MaLoai INT NOT NULL,\n    MaTH INT NOT NULL,\n    CONSTRAINT PK_MATHANG PRIMARY KEY (MaSP),\n    CONSTRAINT UQ_MATHANG_SKU UNIQUE (SKU),\n    CONSTRAINT FK_MATHANG_MaLoai FOREIGN KEY (MaLoai) REFERENCES LOAIHANG(MaLoai),\n    CONSTRAINT FK_MATHANG_MaTH FOREIGN KEY (MaTH) REFERENCES THUONGHIEU(MaTH),\n    CONSTRAINT CK_MATHANG_1 CHECK (GiaNiemYet > 0),\n    CONSTRAINT CK_MATHANG_2 CHECK (GiaKhuyenMai IS NULL OR GiaKhuyenMai <= GiaNiemYet),\n    CONSTRAINT CK_MATHANG_3 CHECK (ThoiHanBH BETWEEN 0 AND 120),\n    CONSTRAINT CK_MATHANG_4 CHECK (TinhTrangKD IN ('Đang kinh doanh', 'Ngừng kinh doanh'))\n);\n\nCREATE TABLE ANHMATHANG (  -- Ảnh mặt hàng\n    MaAnh INT NOT NULL,\n    MaSP INT NOT NULL,\n    ViTriAnh INT NOT NULL,\n    DuongDanAnh VARCHAR(500) NOT NULL,\n    LaAnhChinh BIT NOT NULL,\n    CONSTRAINT PK_ANHMATHANG PRIMARY KEY (MaAnh),\n    CONSTRAINT UQ_ANHMATHANG_MaSP_ViTriAnh UNIQUE (MaSP, ViTriAnh),\n    CONSTRAINT FK_ANHMATHANG_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP),\n    CONSTRAINT CK_ANHMATHANG_1 CHECK (ViTriAnh >= 1)\n);\n\nCREATE TABLE DINHNGHIATHONGSO (  -- Định nghĩa thông số\n    MaTS INT NOT NULL,\n    MaLoai INT NOT NULL,\n    TenTS NVARCHAR(100) NOT NULL,\n    KieuGiaTri NVARCHAR(10) NOT NULL,\n    DonViTS NVARCHAR(20) NULL,\n    BatBuoc BIT NOT NULL,\n    CONSTRAINT PK_DINHNGHIATHONGSO PRIMARY KEY (MaTS),\n    CONSTRAINT FK_DINHNGHIATHONGSO_MaLoai FOREIGN KEY (MaLoai) REFERENCES LOAIHANG(MaLoai),\n    CONSTRAINT CK_DINHNGHIATHONGSO_1 CHECK (KieuGiaTri IN ('Chữ', 'Số', 'Có/Không'))\n);\n\nCREATE TABLE GIATRITHONGSO (  -- Giá trị thông số của mặt hàng\n    MaSP INT NOT NULL,\n    MaTS INT NOT NULL,\n    GiaTriTS NVARCHAR(200) NOT NULL,\n    CONSTRAINT PK_GIATRITHONGSO PRIMARY KEY (MaSP, MaTS),\n    CONSTRAINT FK_GIATRITHONGSO_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP),\n    CONSTRAINT FK_GIATRITHONGSO_MaTS FOREIGN KEY (MaTS) REFERENCES DINHNGHIATHONGSO(MaTS)\n);\n\nCREATE TABLE KHACHHANG (  -- Khách hàng\n    MaKH INT NOT NULL,\n    HoLotKH NVARCHAR(80) NOT NULL,\n    TenKH NVARCHAR(30) NOT NULL,\n    SDTKH VARCHAR(15) NOT NULL,\n    EmailKH VARCHAR(100) NULL,\n    MaSoThueKH VARCHAR(14) NULL,\n    CONSTRAINT PK_KHACHHANG PRIMARY KEY (MaKH)\n);\n\nCREATE TABLE NHANVIEN (  -- Nhân viên\n    MaNV INT NOT NULL,\n    HoLotNV NVARCHAR(80) NOT NULL,\n    TenNV NVARCHAR(30) NOT NULL,\n    SDTNV VARCHAR(15) NOT NULL,\n    EmailNV VARCHAR(100) NULL,\n    NgayVaoLam DATE NOT NULL,\n    NgayNghiViec DATE NULL,\n    TinhTrangNV NVARCHAR(20) NOT NULL,\n    ChucVu NVARCHAR(20) NOT NULL,\n    CONSTRAINT PK_NHANVIEN PRIMARY KEY (MaNV),\n    CONSTRAINT CK_NHANVIEN_1 CHECK (TinhTrangNV IN ('Đang làm', 'Đã nghỉ')),\n    CONSTRAINT CK_NHANVIEN_2 CHECK (NgayNghiViec IS NULL OR NgayNghiViec >= NgayVaoLam),\n    CONSTRAINT CK_NHANVIEN_3 CHECK ((TinhTrangNV = 'Đã nghỉ' AND NgayNghiViec IS NOT NULL) OR (TinhTrangNV <> 'Đã nghỉ' AND NgayNghiViec IS NULL)),\n    CONSTRAINT CK_NHANVIEN_4 CHECK (ChucVu IN ('Quản lý', 'Bán hàng', 'Thu ngân', 'Kỹ thuật', 'Kho', 'Giao hàng'))\n);\n\nCREATE TABLE TAIKHOAN (  -- Tài khoản đăng nhập\n    MaTK INT NOT NULL,\n    TenDangNhap VARCHAR(50) NOT NULL,\n    MatKhauBam VARCHAR(255) NOT NULL,\n    TinhTrangTK NVARCHAR(20) NOT NULL,\n    ThoiDiemTaoTK DATETIME NOT NULL,\n    MaKH INT NULL,\n    MaNV INT NULL,\n    CONSTRAINT PK_TAIKHOAN PRIMARY KEY (MaTK),\n    CONSTRAINT UQ_TAIKHOAN_TenDangNhap UNIQUE (TenDangNhap),\n    CONSTRAINT FK_TAIKHOAN_MaKH FOREIGN KEY (MaKH) REFERENCES KHACHHANG(MaKH),\n    CONSTRAINT FK_TAIKHOAN_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_TAIKHOAN_1 CHECK (TinhTrangTK IN ('Hoạt động', 'Bị khóa')),\n    CONSTRAINT CK_TAIKHOAN_2 CHECK ((MaKH IS NULL AND MaNV IS NOT NULL) OR (MaKH IS NOT NULL AND MaNV IS NULL))\n);\nCREATE UNIQUE INDEX UQ_TAIKHOAN_MaKH ON TAIKHOAN (MaKH) WHERE MaKH IS NOT NULL;\nCREATE UNIQUE INDEX UQ_TAIKHOAN_MaNV ON TAIKHOAN (MaNV) WHERE MaNV IS NOT NULL;\n\nCREATE TABLE NHACUNGCAP (  -- Nhà cung cấp\n    MaNCC INT NOT NULL,\n    TenNCC NVARCHAR(200) NOT NULL,\n    NguoiLienHeNCC NVARCHAR(100) NULL,\n    SDTNCC VARCHAR(15) NULL,\n    DiaChiNCC NVARCHAR(300) NULL,\n    MaSoThueNCC VARCHAR(14) NULL,\n    TinhTrangHT NVARCHAR(20) NOT NULL,\n    CONSTRAINT PK_NHACUNGCAP PRIMARY KEY (MaNCC),\n    CONSTRAINT UQ_NHACUNGCAP_TenNCC UNIQUE (TenNCC),\n    CONSTRAINT CK_NHACUNGCAP_1 CHECK (TinhTrangHT IN ('Đang hợp tác', 'Ngừng hợp tác'))\n);\n\nCREATE TABLE MAGIAMGIA (  -- Mã giảm giá\n    MaMG INT NOT NULL,\n    CodeMG VARCHAR(30) NOT NULL,\n    TenChuongTrinh NVARCHAR(200) NOT NULL,\n    LoaiGiam NVARCHAR(10) NOT NULL,\n    MucGiam DECIMAL(15,2) NOT NULL,\n    DonToiThieu DECIMAL(15,0) NULL,\n    GiamToiDa DECIMAL(15,0) NULL,\n    NgayBatDau DATE NULL,\n    NgayKetThuc DATE NULL,\n    GioiHanLuot INT NULL,\n    MaNV INT NOT NULL,\n    CONSTRAINT PK_MAGIAMGIA PRIMARY KEY (MaMG),\n    CONSTRAINT UQ_MAGIAMGIA_CodeMG UNIQUE (CodeMG),\n    CONSTRAINT FK_MAGIAMGIA_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_MAGIAMGIA_1 CHECK (LoaiGiam IN ('Phần trăm', 'Số tiền')),\n    CONSTRAINT CK_MAGIAMGIA_2 CHECK (MucGiam > 0),\n    CONSTRAINT CK_MAGIAMGIA_3 CHECK (NgayKetThuc IS NULL OR NgayBatDau IS NULL OR NgayKetThuc >= NgayBatDau)\n);\n\nCREATE TABLE DONHANG (  -- Đơn hàng\n    MaDH INT NOT NULL,\n    SoDH VARCHAR(20) NOT NULL,\n    ThoiDiemLap DATETIME NOT NULL,\n    KenhBan NVARCHAR(20) NOT NULL,\n    MaKH INT NULL,\n    MaNV INT NULL,\n    TenNguoiNhan NVARCHAR(100) NULL,\n    SDTNhan VARCHAR(15) NULL,\n    DiaChiGiao NVARCHAR(300) NULL,\n    PhiGiao DECIMAL(15,0) NOT NULL,\n    GiamGia DECIMAL(15,0) NOT NULL,\n    MaMG INT NULL,\n    TinhTrangDH NVARCHAR(20) NOT NULL,\n    DieuKienCoc NVARCHAR(300) NULL,\n    GhiChuDH NVARCHAR(500) NULL,\n    CONSTRAINT PK_DONHANG PRIMARY KEY (MaDH),\n    CONSTRAINT UQ_DONHANG_SoDH UNIQUE (SoDH),\n    CONSTRAINT FK_DONHANG_MaKH FOREIGN KEY (MaKH) REFERENCES KHACHHANG(MaKH),\n    CONSTRAINT FK_DONHANG_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT FK_DONHANG_MaMG FOREIGN KEY (MaMG) REFERENCES MAGIAMGIA(MaMG),\n    CONSTRAINT CK_DONHANG_1 CHECK (KenhBan IN ('Quầy', 'Trang web', 'Điện thoại', 'Tin nhắn')),\n    CONSTRAINT CK_DONHANG_2 CHECK (PhiGiao >= 0),\n    CONSTRAINT CK_DONHANG_3 CHECK (GiamGia >= 0),\n    CONSTRAINT CK_DONHANG_4 CHECK (TinhTrangDH IN ('Chờ xác nhận', 'Đã xác nhận', 'Đang chuẩn bị', 'Đang giao', 'Hoàn tất', 'Đã hủy')),\n    CONSTRAINT CK_DONHANG_5 CHECK (KenhBan = 'Trang web' OR MaNV IS NOT NULL)\n);\n\nCREATE TABLE CHITIETDONHANG (  -- Chi tiết đơn hàng\n    MaDH INT NOT NULL,\n    SoDongDH INT NOT NULL,\n    MaSP INT NOT NULL,\n    SoLuongBan INT NOT NULL,\n    DonGiaChot DECIMAL(15,0) NOT NULL,\n    TenHangChot NVARCHAR(200) NOT NULL,\n    SKUChot VARCHAR(50) NOT NULL,\n    ThoiHanBHChot INT NOT NULL,\n    CONSTRAINT PK_CHITIETDONHANG PRIMARY KEY (MaDH, SoDongDH),\n    CONSTRAINT FK_CHITIETDONHANG_MaDH FOREIGN KEY (MaDH) REFERENCES DONHANG(MaDH),\n    CONSTRAINT FK_CHITIETDONHANG_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP),\n    CONSTRAINT CK_CHITIETDONHANG_1 CHECK (SoLuongBan > 0),\n    CONSTRAINT CK_CHITIETDONHANG_2 CHECK (DonGiaChot >= 0),\n    CONSTRAINT CK_CHITIETDONHANG_3 CHECK (ThoiHanBHChot BETWEEN 0 AND 120)\n);\n\nCREATE TABLE THANHTOAN (  -- Thanh toán\n    MaTT INT NOT NULL,\n    MaDH INT NOT NULL,\n    LoaiKhoan NVARCHAR(15) NOT NULL,\n    PhuongThuc NVARCHAR(20) NOT NULL,\n    SoTien DECIMAL(15,0) NOT NULL,\n    ThoiDiemTT DATETIME NOT NULL,\n    KetQuaTT NVARCHAR(15) NOT NULL,\n    MaGiaoDichNgoai VARCHAR(50) NULL,\n    DonViThanhToan NVARCHAR(50) NULL,\n    MaNV INT NULL,\n    MaNVThu INT NULL,\n    CONSTRAINT PK_THANHTOAN PRIMARY KEY (MaTT),\n    CONSTRAINT FK_THANHTOAN_MaDH FOREIGN KEY (MaDH) REFERENCES DONHANG(MaDH),\n    CONSTRAINT FK_THANHTOAN_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT FK_THANHTOAN_MaNVThu FOREIGN KEY (MaNVThu) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_THANHTOAN_1 CHECK (MaNVThu IS NULL OR PhuongThuc = 'Thu khi giao'),\n    CONSTRAINT CK_THANHTOAN_2 CHECK (SoTien > 0),\n    CONSTRAINT CK_THANHTOAN_3 CHECK (LoaiKhoan IN ('Thanh toán', 'Đặt cọc')),\n    CONSTRAINT CK_THANHTOAN_4 CHECK (KetQuaTT IN ('Thành công', 'Thất bại', 'Chờ'))\n);\n\nCREATE TABLE PHIEUGIAO (  -- Phiếu giao hàng\n    MaGiao INT NOT NULL,\n    MaDH INT NOT NULL,\n    MaNV INT NOT NULL,\n    ThoiDiemXuat DATETIME NOT NULL,\n    TinhTrangGiao NVARCHAR(20) NOT NULL,\n    CONSTRAINT PK_PHIEUGIAO PRIMARY KEY (MaGiao),\n    CONSTRAINT UQ_PHIEUGIAO_MaDH UNIQUE (MaDH),\n    CONSTRAINT FK_PHIEUGIAO_MaDH FOREIGN KEY (MaDH) REFERENCES DONHANG(MaDH),\n    CONSTRAINT FK_PHIEUGIAO_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_PHIEUGIAO_1 CHECK (TinhTrangGiao IN ('Đang giao', 'Đã giao', 'Không thành công'))\n);\n\nCREATE TABLE LANGIAO (  -- Lần giao hàng\n    MaGiao INT NOT NULL,\n    SoLan INT NOT NULL,\n    ThoiDiemGiao DATETIME NOT NULL,\n    KetQuaGiao NVARCHAR(20) NOT NULL,\n    LyDoThatBai NVARCHAR(300) NULL,\n    MaNV INT NOT NULL,\n    CONSTRAINT PK_LANGIAO PRIMARY KEY (MaGiao, SoLan),\n    CONSTRAINT FK_LANGIAO_MaGiao FOREIGN KEY (MaGiao) REFERENCES PHIEUGIAO(MaGiao),\n    CONSTRAINT FK_LANGIAO_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_LANGIAO_1 CHECK (SoLan BETWEEN 1 AND 3)\n);\n\nCREATE TABLE PHIEUNHAP (  -- Phiếu nhập\n    MaPN INT NOT NULL,\n    SoPhieu VARCHAR(20) NOT NULL,\n    MaNCC INT NOT NULL,\n    MaNV INT NOT NULL,\n    ThoiDiemNhan DATETIME NOT NULL,\n    TinhTrangPN NVARCHAR(20) NOT NULL,\n    MaNVXacNhan INT NULL,\n    ThoiDiemXacNhan DATETIME NULL,\n    SoHoaDonNCC VARCHAR(30) NULL,\n    GhiChuPN NVARCHAR(500) NULL,\n    CONSTRAINT PK_PHIEUNHAP PRIMARY KEY (MaPN),\n    CONSTRAINT UQ_PHIEUNHAP_SoPhieu UNIQUE (SoPhieu),\n    CONSTRAINT FK_PHIEUNHAP_MaNCC FOREIGN KEY (MaNCC) REFERENCES NHACUNGCAP(MaNCC),\n    CONSTRAINT FK_PHIEUNHAP_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT FK_PHIEUNHAP_MaNVXacNhan FOREIGN KEY (MaNVXacNhan) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_PHIEUNHAP_1 CHECK (TinhTrangPN IN ('Nháp', 'Đã xác nhận', 'Đã hủy')),\n    CONSTRAINT CK_PHIEUNHAP_2 CHECK ((MaNVXacNhan IS NULL AND ThoiDiemXacNhan IS NULL) OR (MaNVXacNhan IS NOT NULL AND ThoiDiemXacNhan IS NOT NULL))\n);\n\nCREATE TABLE CHITIETPHIEUNHAP (  -- Chi tiết phiếu nhập\n    MaPN INT NOT NULL,\n    SoDongPN INT NOT NULL,\n    MaSP INT NOT NULL,\n    SoLuongNhap INT NOT NULL,\n    GiaNhap DECIMAL(15,0) NOT NULL,\n    CONSTRAINT PK_CHITIETPHIEUNHAP PRIMARY KEY (MaPN, SoDongPN),\n    CONSTRAINT FK_CHITIETPHIEUNHAP_MaPN FOREIGN KEY (MaPN) REFERENCES PHIEUNHAP(MaPN),\n    CONSTRAINT FK_CHITIETPHIEUNHAP_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP),\n    CONSTRAINT CK_CHITIETPHIEUNHAP_1 CHECK (SoLuongNhap > 0),\n    CONSTRAINT CK_CHITIETPHIEUNHAP_2 CHECK (GiaNhap >= 0)\n);\n\nCREATE TABLE SERIMATHANG (  -- Nhận diện chiếc hàng (số seri theo mặt hàng)\n    MaSeri INT NOT NULL,\n    SoSeri VARCHAR(60) NOT NULL,\n    MaSP INT NOT NULL,\n    CONSTRAINT PK_SERIMATHANG PRIMARY KEY (MaSeri),\n    CONSTRAINT UQ_SERIMATHANG_MaSP_SoSeri UNIQUE (MaSP, SoSeri),\n    CONSTRAINT FK_SERIMATHANG_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP)\n);\n\nCREATE TABLE HANGCOSERI (  -- Chiếc hàng có số seri (thông tin nhập và bán)\n    MaSeri INT NOT NULL,\n    MaPN INT NOT NULL,\n    SoDongPN INT NOT NULL,\n    MaDH INT NULL,\n    SoDongDH INT NULL,\n    TinhTrangSeri NVARCHAR(20) NOT NULL,\n    ThoiDiemNhap DATETIME NOT NULL,\n    CONSTRAINT PK_HANGCOSERI PRIMARY KEY (MaSeri),\n    CONSTRAINT FK_HANGCOSERI_MaSeri FOREIGN KEY (MaSeri) REFERENCES SERIMATHANG(MaSeri),\n    CONSTRAINT FK_HANGCOSERI_MaPN_SoDongPN FOREIGN KEY (MaPN, SoDongPN) REFERENCES CHITIETPHIEUNHAP(MaPN, SoDongPN),\n    CONSTRAINT FK_HANGCOSERI_MaDH_SoDongDH FOREIGN KEY (MaDH, SoDongDH) REFERENCES CHITIETDONHANG(MaDH, SoDongDH),\n    CONSTRAINT CK_HANGCOSERI_1 CHECK ((MaDH IS NULL AND SoDongDH IS NULL) OR (MaDH IS NOT NULL AND SoDongDH IS NOT NULL))\n);\n\nCREATE TABLE GIAODICHKHO (  -- Giao dịch kho\n    MaGDK INT NOT NULL,\n    MaSP INT NOT NULL,\n    NhomKho NVARCHAR(20) NOT NULL,\n    LoaiBienDong NVARCHAR(20) NOT NULL,\n    SoLuongGD INT NOT NULL,\n    ThoiDiemGD DATETIME NOT NULL,\n    MaNV INT NULL,\n    LoaiChungTu NVARCHAR(20) NULL,\n    MaChungTu INT NULL,\n    GhiChuGD NVARCHAR(500) NULL,\n    CONSTRAINT PK_GIAODICHKHO PRIMARY KEY (MaGDK),\n    CONSTRAINT FK_GIAODICHKHO_MaSP FOREIGN KEY (MaSP) REFERENCES MATHANG(MaSP),\n    CONSTRAINT FK_GIAODICHKHO_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_GIAODICHKHO_1 CHECK (SoLuongGD > 0),\n    CONSTRAINT CK_GIAODICHKHO_2 CHECK (NhomKho IN ('Đủ điều kiện bán', 'Chờ kiểm tra', 'Chờ xử lý')),\n    CONSTRAINT CK_GIAODICHKHO_3 CHECK (LoaiBienDong IN ('Nhập', 'Xuất bán', 'Nhận lại', 'Chuyển ra', 'Chuyển vào'))\n);\n\nCREATE TABLE HOSODOITRA (  -- Hồ sơ đổi trả\n    MaHS INT NOT NULL,\n    MaDH INT NOT NULL,\n    MaNV INT NOT NULL,\n    NgayDeNghi DATE NOT NULL,\n    LoaiTruongHop NVARCHAR(30) NOT NULL,\n    LyDoDoiTra NVARCHAR(500) NOT NULL,\n    TinhTrangHS NVARCHAR(20) NOT NULL,\n    HinhThucXuLy NVARCHAR(20) NULL,\n    CONSTRAINT PK_HOSODOITRA PRIMARY KEY (MaHS),\n    CONSTRAINT FK_HOSODOITRA_MaDH FOREIGN KEY (MaDH) REFERENCES DONHANG(MaDH),\n    CONSTRAINT FK_HOSODOITRA_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV)\n);\n\nCREATE TABLE CHITIETTRA (  -- Chi tiết trả hàng\n    MaHS INT NOT NULL,\n    SoDongTra INT NOT NULL,\n    SoDongDH INT NOT NULL,\n    SoLuongTra INT NOT NULL,\n    MaSeri INT NULL,\n    CONSTRAINT PK_CHITIETTRA PRIMARY KEY (MaHS, SoDongTra),\n    CONSTRAINT FK_CHITIETTRA_MaHS FOREIGN KEY (MaHS) REFERENCES HOSODOITRA(MaHS),\n    CONSTRAINT FK_CHITIETTRA_MaSeri FOREIGN KEY (MaSeri) REFERENCES HANGCOSERI(MaSeri),\n    CONSTRAINT CK_CHITIETTRA_1 CHECK (SoLuongTra > 0),\n    CONSTRAINT CK_CHITIETTRA_2 CHECK (MaSeri IS NULL OR SoLuongTra = 1)\n);\nCREATE UNIQUE INDEX UQ_CHITIETTRA_MaHS_MaSeri ON CHITIETTRA (MaHS, MaSeri) WHERE MaSeri IS NOT NULL;\n\nCREATE TABLE LANNHANLAI (  -- Lần nhận lại hàng\n    MaNhanLai INT NOT NULL,\n    MaHS INT NOT NULL,\n    ThoiDiemNhanLai DATETIME NOT NULL,\n    MaNV INT NULL,\n    KetLuan NVARCHAR(200) NULL,\n    NhomSauKiemTra NVARCHAR(20) NULL,\n    ThoiDiemDuyet DATETIME NULL,\n    MaNVDuyet INT NULL,\n    CONSTRAINT PK_LANNHANLAI PRIMARY KEY (MaNhanLai),\n    CONSTRAINT FK_LANNHANLAI_MaHS FOREIGN KEY (MaHS) REFERENCES HOSODOITRA(MaHS),\n    CONSTRAINT FK_LANNHANLAI_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT FK_LANNHANLAI_MaNVDuyet FOREIGN KEY (MaNVDuyet) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_LANNHANLAI_1 CHECK ((MaNVDuyet IS NULL AND ThoiDiemDuyet IS NULL) OR (MaNVDuyet IS NOT NULL AND ThoiDiemDuyet IS NOT NULL)),\n    CONSTRAINT CK_LANNHANLAI_2 CHECK (NhomSauKiemTra IN ('Đủ điều kiện bán', 'Chờ xử lý'))\n);\n\nCREATE TABLE PHIEUBAOHANH (  -- Phiếu tiếp nhận bảo hành\n    MaPhieuBH INT NOT NULL,\n    MaSeri INT NULL,\n    MaDH INT NOT NULL,\n    SoDongDH INT NOT NULL,\n    MoTaLoi NVARCHAR(500) NOT NULL,\n    PhuKienDiKem NVARCHAR(300) NULL,\n    NgayNhan DATE NOT NULL,\n    NgayHenTra DATE NULL,\n    NgayTraThucTe DATE NULL,\n    TinhTrangBH NVARCHAR(20) NOT NULL,\n    KetQuaBH NVARCHAR(30) NULL,\n    LyDoTuChoi NVARCHAR(300) NULL,\n    MaNV INT NOT NULL,\n    CONSTRAINT PK_PHIEUBAOHANH PRIMARY KEY (MaPhieuBH),\n    CONSTRAINT FK_PHIEUBAOHANH_MaSeri FOREIGN KEY (MaSeri) REFERENCES HANGCOSERI(MaSeri),\n    CONSTRAINT FK_PHIEUBAOHANH_MaDH_SoDongDH FOREIGN KEY (MaDH, SoDongDH) REFERENCES CHITIETDONHANG(MaDH, SoDongDH),\n    CONSTRAINT FK_PHIEUBAOHANH_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_PHIEUBAOHANH_1 CHECK (NgayHenTra >= NgayNhan)\n);\n\nCREATE TABLE KHOANHOAN (  -- Khoản hoàn tiền\n    MaHoan INT NOT NULL,\n    MaTT INT NOT NULL,\n    MaHS INT NULL,\n    MaPhieuBH INT NULL,\n    MaNV INT NOT NULL,\n    SoTienHoan DECIMAL(15,0) NOT NULL,\n    PhuongThucHoan NVARCHAR(30) NOT NULL,\n    ThoiDiemDuyetHoan DATETIME NOT NULL,\n    ThoiDiemChi DATETIME NULL,\n    MaNVChi INT NULL,\n    CONSTRAINT PK_KHOANHOAN PRIMARY KEY (MaHoan),\n    CONSTRAINT FK_KHOANHOAN_MaTT FOREIGN KEY (MaTT) REFERENCES THANHTOAN(MaTT),\n    CONSTRAINT FK_KHOANHOAN_MaHS FOREIGN KEY (MaHS) REFERENCES HOSODOITRA(MaHS),\n    CONSTRAINT FK_KHOANHOAN_MaPhieuBH FOREIGN KEY (MaPhieuBH) REFERENCES PHIEUBAOHANH(MaPhieuBH),\n    CONSTRAINT FK_KHOANHOAN_MaNV FOREIGN KEY (MaNV) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT FK_KHOANHOAN_MaNVChi FOREIGN KEY (MaNVChi) REFERENCES NHANVIEN(MaNV),\n    CONSTRAINT CK_KHOANHOAN_1 CHECK (SoTienHoan > 0),\n    CONSTRAINT CK_KHOANHOAN_2 CHECK ((MaNVChi IS NULL AND ThoiDiemChi IS NULL) OR (MaNVChi IS NOT NULL AND ThoiDiemChi IS NOT NULL)),\n    CONSTRAINT CK_KHOANHOAN_3 CHECK (MaHS IS NULL OR MaPhieuBH IS NULL)\n);\n", "duLieu": "-- Dữ liệu minh họa nhỏ do nhóm tạo để kiểm tra các câu truy vấn của chương 3 (không phải dữ liệu thật của cửa hàng).\n-- Mọi khóa ngoại đều thỏa; có đủ trường
